# Combined worst case: narrow FOV plus noise plus dropout.
radar:
  profile_name: "degraded"
  sensors:
    - sensor_id: "front"
      blueprint: "sensor.other.radar"
      horizontal_fov_deg: 45.0
      vertical_fov_deg: 10.0
      range_m: 70.0
      points_per_second: 4000
      sensor_tick_s: 0.05
      mount:
        x: 2.2
        y: 0.0
        z: 1.0
        yaw_deg: 0.0
        pitch_deg: 0.0
  degradation:
    enabled: true
    dropout_prob: 0.25
    point_dropout_prob: 0.25
    range_noise_sigma_m: 0.60
    azimuth_noise_sigma_rad: 0.030
    velocity_noise_sigma_mps: 0.60
