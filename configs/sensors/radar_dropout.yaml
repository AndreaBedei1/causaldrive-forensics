# Baseline geometry with heavy intermittent loss of radar frames and returns.
radar:
  profile_name: "dropout"
  sensors:
    - sensor_id: "front"
      blueprint: "sensor.other.radar"
      horizontal_fov_deg: 120.0
      vertical_fov_deg: 10.0
      range_m: 90.0
      points_per_second: 6000
      sensor_tick_s: 0.05
      mount:
        x: 2.2
        y: 0.0
        z: 1.0
        yaw_deg: 0.0
        pitch_deg: 0.0
  degradation:
    enabled: true
    dropout_prob: 0.35
    point_dropout_prob: 0.30
    range_noise_sigma_m: 0.20
    azimuth_noise_sigma_rad: 0.010
    velocity_noise_sigma_mps: 0.20
