# Baseline automotive front radar.
# Values chosen to match a typical mid-range automotive radar and verified to
# deliver ~79 frames per 80 synchronous ticks on the tested CARLA build.
radar:
  profile_name: "baseline"
  sensors:
    - sensor_id: "front"
      blueprint: "sensor.other.radar"
      horizontal_fov_deg: 120.0
      vertical_fov_deg: 10.0
      range_m: 90.0
      points_per_second: 6000
      sensor_tick_s: 0.05
      mount:
        x: 2.2      # metres forward of the vehicle origin
        y: 0.0
        z: 1.0
        yaw_deg: 0.0
        pitch_deg: 0.0
  degradation:
    enabled: false
    dropout_prob: 0.0           # probability an entire frame is discarded
    point_dropout_prob: 0.0     # probability an individual return is discarded
    range_noise_sigma_m: 0.0
    azimuth_noise_sigma_rad: 0.0
    velocity_noise_sigma_mps: 0.0
