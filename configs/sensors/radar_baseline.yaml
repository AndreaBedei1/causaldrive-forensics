# Baseline radars of every vehicle: a front radar and two side radars on the body, no
# rear radar, so a blind zone lies directly behind the vehicle (measured in CARLA with a
# car-sized probe: invisible within about +-14 deg of straight behind at 10-40 m, +-12 deg
# at 5 m; single points within the side radars' +-20 deg cones).
#
# Mounts are resolved from each vehicle's OWN bounding box when it is spawned: just outside
# the box (gap_m), at bumper / door height (z above the ground).  Checked on model3, audi.tt,
# nissan.patrol and mercedes.sprinter: no radar ever returns from its own vehicle.
#
# CARLA's radar fills a cone of half-width tan(fov/2) x range: a horizontal FOV must stay
# below 180 deg.  Off its axis a ray reaches beyond range_m: returns beyond it are dropped.
# Front and side cover each other between +-24 and +-72 deg (no gap at the transition).
#
# Returns per car per sweep (all three radars, a model3 at the given bearing and range,
# 12000 pps each, vertical FOV 20 deg): ahead 76 / 19 / 11 / 7 at 10 / 25 / 40 / 60 m,
# beside 112 / 42 / 24 / 16, rear quarter (140 deg) 91 / 14 / 5 / 2.5.  At 6000 pps the rear
# quarter at 60 m drops below one return per sweep.
radar:
  profile_name: "baseline"
  sensors:
    - sensor_id: "front"
      blueprint: "sensor.other.radar"
      horizontal_fov_deg: 150.0      # +-75 deg
      vertical_fov_deg: 20.0         # +-10 deg: a low radar sees vehicle bodies edge-on
      range_m: 90.0                  # radial; 6 s at the 50 km/h limit is 83 m
      points_per_second: 12000
      sensor_tick_s: 0.05
      mount:
        anchor: front                # centre line, just ahead of the front face of the box
        gap_m: 0.05
        z: 0.6                       # bumper height
        yaw_deg: 0.0
        pitch_deg: 0.0
    - sensor_id: "left"
      blueprint: "sensor.other.radar"
      horizontal_fov_deg: 140.0      # bearings -160 .. -20 deg
      vertical_fov_deg: 20.0
      range_m: 90.0
      points_per_second: 12000
      sensor_tick_s: 0.05
      mount:
        anchor: left                 # middle of the left side, just outside the box
        gap_m: 0.05
        z: 0.6
        yaw_deg: -90.0
        pitch_deg: 0.0
    - sensor_id: "right"
      blueprint: "sensor.other.radar"
      horizontal_fov_deg: 140.0      # bearings 20 .. 160 deg
      vertical_fov_deg: 20.0
      range_m: 90.0
      points_per_second: 12000
      sensor_tick_s: 0.05
      mount:
        anchor: right
        gap_m: 0.05
        z: 0.6
        yaw_deg: 90.0
        pitch_deg: 0.0
