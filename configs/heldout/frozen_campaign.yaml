# Held-out generalization study of the frozen reconstruction (predeclared before any recording).
#
# Every case is a NEW traffic configuration of one of the canonical scenario families: it starts from a canonical
# scenario (base, base_variant) and changes physical properties only -- vehicle blueprints (none of the five
# canonical ones: tesla.model3, audi.tt, nissan.patrol, mercedes.sprinter, toyota.prius), initial separations,
# speeds, manoeuvre timing and which manoeuvres happen.  `changes` is deep-merged over the base variant exactly as
# a scenario variant is (participant_overrides by participant id; a list such as `actions` replaces the base list);
# `disable_actions` switches named scripted actions off (as run_scenario --disable-action).
#
# Recording: scripts/generalization.py record, private engine (port 3000), output heldout/frozen_campaign/
# (never traces/).  The simulator is deterministic in synchronous mode: the seed does not create a new physical
# scenario, so every case is recorded once, seed 0.  The complete actual outcome is kept, also when it differs
# from the intended one (an unintended contact, a missed one): the intended outcome is declared only to report
# the agreement, never to select or re-record.
#
# Before recording, only a static check is allowed: every spawn and route must resolve on the map
# (`generalization.py check`, no simulation, no outcome).  A case that fails it is reported as invalid.
protocol:
  version: frozen_campaign
  seeds: [0]
  expected_recordings: 32
  acceptance:
    # A recording is physically valid when all hold (privileged checks of the simulation, never of the
    # reconstruction); an invalid one is reported individually and left out of the aggregates.
    completed: the runner finished and every declared participant spawned and wrote ground truth
    on_road_before_contact: >-
      every participant's centre lies on a driving lane of the map (CARLA waypoint, no
      projection) at every sample before its first contact
    speed_bound_mps: 3.0  # no participant exceeds its highest scripted speed by more than this, before contact
    attitude_before_contact_deg: 10.0  # |pitch| and |roll| before the participant's first contact
    attitude_whole_run_deg: 60.0  # no rollover at any time
  metrics: >-
    the frozen campaign's existing evaluation (scripts/robustness.py extra_evaluation and run_metrics),
    collisions detected / identified / missed / wrong, recorder links, association accuracy, merges, phantom and
    duplicate hypotheses (distance bands 0-10 / 10-25 / >25 m and incident participants), fused trajectory errors
    (median, p95, max), stability audit (track losses, EGO_PATH oscillations, CUT_IN against its ground-truth
    criterion, CRITICAL_TTC closure), event oracle (reconstruction vs the ground-truth oracles)

cases:
# --- rear-end collisions (S01: A follows B in one lane, B brakes, A late) ---
- id: H01
  family: rear_end
  base: S01
  intended: {collision: [A, B]}
  description: "lighter follower behind a van at 12 m/s, 24 m gap, 1.4 s reaction"
  changes:
    participant_overrides:
      A: {blueprint: vehicle.lincoln.mkz_2020, initial_speed: 12.0, target_speed: 12.0,
          actions: [{action_id: A_late_brake, kind: brake, t_start: 5.4, duration: 6.0, params: {intensity: 0.85}}]}
      B: {blueprint: vehicle.volkswagen.t2_2021, initial_speed: 12.0, target_speed: 12.0, spawn: {forward_m: 24.0}}
- id: H02
  family: rear_end
  base: S01
  intended: {collision: []}
  description: "SUV follower reacts 0.6 s after the leader's emergency brake and stops behind it"
  changes:
    participant_overrides:
      A: {blueprint: vehicle.jeep.wrangler_rubicon,
          actions: [{action_id: A_brake, kind: brake, t_start: 4.6, duration: 8.0, params: {intensity: 1.0}}]}
      B: {blueprint: vehicle.mini.cooper_s_2021}
- id: H03
  family: rear_end
  base: S01
  intended: {collision: [A, B]}
  description: "faster pair (16 m/s), 34 m gap, small car follows a large saloon, 1.8 s reaction"
  changes:
    participant_overrides:
      A: {blueprint: vehicle.citroen.c3, initial_speed: 16.0, target_speed: 16.0,
          actions: [{action_id: A_late_brake, kind: brake, t_start: 5.8, duration: 6.0, params: {intensity: 0.85}}]}
      B: {blueprint: vehicle.dodge.charger_2020, initial_speed: 16.0, target_speed: 16.0, spawn: {forward_m: 34.0}}

# --- cut-ins (S02 crash: B cuts from the left lane into A's lane ahead) ---
- id: H04
  family: cut_in
  base: S02
  base_variant: crash
  intended: {collision: [A, B]}
  description: "a van cuts in, same timing as the canonical crash"
  changes:
    participant_overrides:
      A: {blueprint: vehicle.chevrolet.impala}
      B: {blueprint: vehicle.volkswagen.t2_2021}
- id: H05
  family: cut_in
  base: S02
  base_variant: crash
  intended: {collision: []}
  description: "the cut-in ends 45 m ahead and A brakes moderately at once"
  changes:
    participant_overrides:
      A: {blueprint: vehicle.audi.etron,
          actions: [{action_id: A_brake, kind: brake, t_start: 2.5, duration: 5.0, params: {intensity: 0.6}}]}
      B: {blueprint: vehicle.ford.mustang, spawn: {forward_m: 45.0}}
- id: H06
  family: cut_in
  base: S02
  base_variant: crash
  intended: {collision: [A, B]}
  description: "a slow small car cuts in slowly (2.8 s lateral manoeuvre) in front of a 13 m/s follower"
  changes:
    participant_overrides:
      A: {blueprint: vehicle.seat.leon, initial_speed: 13.0, target_speed: 13.0,
          actions: [{action_id: A_late_brake, kind: brake, t_start: 4.3, duration: 6.0, params: {intensity: 0.85}}]}
      B: {blueprint: vehicle.nissan.micra, initial_speed: 7.0, target_speed: 7.0, spawn: {forward_m: 30.0},
          actions: [{action_id: B_cut_in, kind: lane_shift, t_start: 0.5, duration: 2.8, params: {lateral_m: 3.5}},
                    {action_id: B_slow_after_cut_in, kind: set_speed, t_start: 3.3, duration: 12.0,
                     params: {target_speed: 5.0}}]}

# --- perpendicular crossings (S03: B from the side fails to yield) ---
- id: H07
  family: crossing
  base: S03
  intended: {collision: [A, B]}
  description: "SUV on the main road at 11 m/s, small car crossing"
  changes:
    participant_overrides:
      A: {blueprint: vehicle.jeep.wrangler_rubicon, initial_speed: 11.0, target_speed: 11.0}
      B: {blueprint: vehicle.audi.a2}
- id: H08
  family: crossing
  base: S03
  intended: {collision: []}
  description: "the crossing car accelerates less and later, arriving after A has cleared the junction"
  changes:
    participant_overrides:
      A: {blueprint: vehicle.ford.crown}
      B: {blueprint: vehicle.mercedes.coupe_2020,
          actions: [{action_id: B_late_crossing, kind: set_speed, t_start: 2.5, duration: 14.0,
                     params: {target_speed: 9.0}}]}
- id: H09
  family: crossing
  base: S03
  intended: {collision: [A, B]}
  description: "a light truck fails to yield to a car"
  changes:
    participant_overrides:
      A: {blueprint: vehicle.mercedes.coupe_2020}
      B: {blueprint: vehicle.carlamotors.carlacola,
          actions: [{action_id: B_fail_to_yield, kind: set_speed, t_start: 1.2, duration: 14.0,
                     params: {target_speed: 11.5}}]}

# --- roundabouts (S07: A circulating, B enters from the south) ---
- id: H10
  family: roundabout
  base: S07
  intended: {collision: [A, B]}
  description: "other cars, same manoeuvres and signals"
  changes:
    participant_overrides:
      A: {blueprint: vehicle.mercedes.coupe_2020}
      B: {blueprint: vehicle.nissan.micra}
- id: H11
  family: roundabout
  base: S07
  intended: {collision: []}
  description: "B slows down to give way instead of accelerating into the circulating lane"
  changes:
    participant_overrides:
      A: {blueprint: vehicle.lincoln.mkz_2020}
      B: {blueprint: vehicle.bmw.grandtourer,
          actions: [{action_id: B_gives_way, kind: set_speed, t_start: 15.5, duration: 14.0, params: {target_speed: 2.0}},
                    {action_id: B_indicator_right, kind: indicator, t_start: 13.0, duration: 6.1, params: {side: 1}}]}
- id: H12
  family: roundabout
  base: S07
  intended: {collision: [A, B]}
  description: "a van enters and fails to give way to a saloon"
  changes:
    participant_overrides:
      A: {blueprint: vehicle.chevrolet.impala}
      B: {blueprint: vehicle.volkswagen.t2_2021}

# --- chain collisions (S04, S05) ---
- id: H13
  family: chain
  base: S04
  base_variant: a_front_pushed
  intended: {collision: [A, B, C]}
  description: "three new blueprints, A pushed into the front pair"
  changes:
    participant_overrides:
      A: {blueprint: vehicle.dodge.charger_2020}
      B: {blueprint: vehicle.bmw.grandtourer}
      C: {blueprint: vehicle.jeep.wrangler_rubicon}
- id: H14
  family: chain
  base: S04
  base_variant: b_rear_first
  intended: {collision: [A, B, C]}
  description: "rear contact first, with a van at the front"
  changes:
    participant_overrides:
      A: {blueprint: vehicle.audi.etron}
      B: {blueprint: vehicle.citroen.c3}
      C: {blueprint: vehicle.ford.ambulance}
- id: H15
  family: chain
  base: S05
  intended: {collision: [A, B]}
  description: "a van between the follower and the stopping leader hides the leader"
  changes:
    participant_overrides:
      A: {blueprint: vehicle.seat.leon}
      B: {blueprint: vehicle.volkswagen.t2_2021}
      C: {blueprint: vehicle.mini.cooper_s_2021}

# --- traffic occlusions (S17: a van hides B from A; both move into the middle lane) ---
- id: H16
  family: occlusion
  base: S17
  intended: {collision: [A, B]}
  description: "the occluder is a light truck"
  changes:
    participant_overrides:
      B: {blueprint: vehicle.ford.mustang}
      V: {blueprint: vehicle.carlamotors.carlacola}
- id: H17
  family: occlusion
  base: S17
  intended: {collision: []}
  description: "A keeps its lane (no lane change): B re-appears and nobody touches"
  disable_actions: [A_moves_left]
  changes:
    participant_overrides:
      A: {blueprint: vehicle.lincoln.mkz_2020}
      B: {blueprint: vehicle.chevrolet.impala}
- id: H18
  family: occlusion
  base: S17
  intended: {collision: [A, B]}
  description: "ambulance as occluder, other cars around"
  changes:
    participant_overrides:
      A: {blueprint: vehicle.chevrolet.impala}
      B: {blueprint: vehicle.lincoln.mkz_2020}
      V: {blueprint: vehicle.ford.ambulance}
      C: {blueprint: vehicle.mercedes.coupe_2020}
      D: {blueprint: vehicle.citroen.c3}
      E: {blueprint: vehicle.seat.leon}

# --- non-recording causal vehicles (S12: unrecorded C cuts in, A swerves into B) ---
- id: H19
  family: unrecorded_causal
  base: S12
  intended: {collision: [A, B]}
  description: "other cars; the causal vehicle cuts in 0.3 s later"
  changes:
    participant_overrides:
      A: {blueprint: vehicle.audi.etron}
      B: {blueprint: vehicle.jeep.wrangler_rubicon}
      C: {blueprint: vehicle.dodge.charger_2020,
          actions: [{action_id: C_cut_in_left, kind: lane_shift, t_start: 2.3, duration: 1.0, params: {lateral_m: -3.5}},
                    {action_id: C_drives_away, kind: set_speed, t_start: 7.0, duration: 4.0, params: {target_speed: 16.0}}]}
- id: H20
  family: unrecorded_causal
  base: S12
  intended: {collision: [A, B]}
  description: "the causal vehicle is a van starting 5 m further ahead"
  changes:
    participant_overrides:
      A: {blueprint: vehicle.seat.leon}
      B: {blueprint: vehicle.bmw.grandtourer}
      C: {blueprint: vehicle.volkswagen.t2_2021, spawn: {forward_m: 35.75}}
- id: H21
  family: unrecorded_causal
  base: S12
  intended: {collision: []}
  description: "the neighbour lane is free (B 25 m further back): A's swerve touches nobody"
  changes:
    participant_overrides:
      A: {blueprint: vehicle.mini.cooper_s_2021}
      B: {blueprint: vehicle.ford.mustang, spawn: {forward_m: -12.5}}
      C: {blueprint: vehicle.chevrolet.impala}

# --- adjacent-lane traffic (S13 anonymous pair, S11 secondary collision) ---
- id: H22
  family: adjacent_lane
  base: S13
  base_variant: abreast
  intended: {collision: [A, B]}
  description: "other cars abreast ahead in two lanes"
  changes:
    participant_overrides:
      A: {blueprint: vehicle.seat.leon}
      B: {blueprint: vehicle.jeep.wrangler_rubicon}
      C: {blueprint: vehicle.mercedes.coupe_2020}
      D: {blueprint: vehicle.nissan.micra}
- id: H23
  family: adjacent_lane
  base: S13
  base_variant: passing
  intended: {collision: [A, B]}
  description: "a van passes a car in the right lane ahead"
  changes:
    participant_overrides:
      A: {blueprint: vehicle.audi.a2}
      B: {blueprint: vehicle.dodge.charger_2020}
      C: {blueprint: vehicle.lincoln.mkz_2020}
      D: {blueprint: vehicle.volkswagen.t2_2021}
- id: H24
  family: adjacent_lane
  base: S11
  intended: {collision: [A, B]}
  description: "lane change in front of a large saloon with an ambulance in the target lane"
  changes:
    participant_overrides:
      A: {blueprint: vehicle.mini.cooper_s_2021}
      B: {blueprint: vehicle.dodge.charger_2020}
      C: {blueprint: vehicle.ford.ambulance}

