      B: {blueprint: vehicle.jeep.wrangler_rubicon}
      C: {blueprint: vehicle.lincoln.mkz_2020}
      D: {blueprint: vehicle.mini.cooper_s_2021}
      E: {blueprint: vehicle.ford.mustang}
      F: {blueprint: vehicle.seat.leon}
      G: {blueprint: vehicle.nissan.micra}
      H: {blueprint: vehicle.chevrolet.impala}
      J: {blueprint: vehicle.audi.etron}
      P: {blueprint: vehicle.mercedes.coupe_2020}
- id: H26
  family: dense
  base: S15
  intended: {collision: [A, B]}
  description: "the dense platoon at 10 m/s with other blueprints"
  changes:
    participant_overrides:
      A: {blueprint: vehicle.audi.etron, initial_speed: 10.0, target_speed: 10.0}
      B: {blueprint: vehicle.bmw.grandtourer, initial_speed: 10.0, target_speed: 10.0}
      C: {blueprint: vehicle.lincoln.mkz_2020, initial_speed: 10.0, target_speed: 10.0}
      D: {blueprint: vehicle.citroen.c3, initial_speed: 10.0, target_speed: 10.0}
      E: {blueprint: vehicle.mercedes.coupe_2020, initial_speed: 10.0, target_speed: 10.0}
      F: {blueprint: vehicle.nissan.micra, initial_speed: 10.0, target_speed: 10.0}
      G: {blueprint: vehicle.seat.leon, initial_speed: 10.0, target_speed: 10.0}
