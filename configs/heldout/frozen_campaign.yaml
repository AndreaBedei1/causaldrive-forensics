# --- overtaking (S16) ---
- id: H28
  family: overtaking
  base: S16
  intended: {collision: [A, B]}
  description: "the overtaking lane 1 m/s faster, other blueprints"
  changes:
    participant_overrides:
      A: {blueprint: vehicle.audi.etron}
      B: {blueprint: vehicle.dodge.charger_2020, initial_speed: 15.0, target_speed: 15.0}
      H: {blueprint: vehicle.seat.leon, initial_speed: 15.0, target_speed: 15.0}
