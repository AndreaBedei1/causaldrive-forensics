simulation:
  host: "127.0.0.1"
  port: 2000
  timeout_s: 60.0
  synchronous_mode: true
  fixed_delta_seconds: 0.05
  substepping: true
  max_substep_delta_time: 0.01
  max_substeps: 10
  traffic_manager_enabled: true
  traffic_manager_port: 8000
  map_switch_settle_s: 60.0
  spawn_z_offset: 0.3
  warmup_ticks: 20
  min_spawn_gap_m: 5.0
  max_duration_s: 45.0
  gpu: auto
sensors:
  profile: "radar_baseline"
  camera:
    enabled: true
    sensor_id: "front_rgb"
    blueprint: "sensor.camera.rgb"
    width: 800
    height: 600
    fov_deg: 90.0
    sensor_tick_s: 0.25
    mount_x: 1.4
    mount_y: 0.0
    mount_z: 1.4
    mount_pitch_deg: 0.0
    mount_yaw_deg: 0.0
    mount_roll_deg: 0.0
  depth_camera:
    enabled: true
    sensor_id: "front_depth"
    blueprint: "sensor.camera.depth"
    width: 800
    height: 600
    fov_deg: 90.0
    sensor_tick_s: 0.05
    mount_x: 1.4
    mount_y: 0.0
    mount_z: 1.4
    mount_pitch_deg: 0.0
    mount_yaw_deg: 0.0
    mount_roll_deg: 0.0
depth_observations:
  max_range_m: 90.0
  horizontal_fov_deg: 90.0
  vertical_fov_deg: 10.0
  azimuth_bin_deg: 2.0
  altitude_bin_deg: 2.0
  suppress_ground: true
  min_relative_height_m: -0.9
traffic_signs:
  min_area_px: 240
  min_fill_ratio: 0.80
  min_redness: 0.28
  min_confidence: 0.45
  approx_epsilon: 0.025
  min_saturation: 90
  min_value: 50
  close_kernel_px: 9
  max_centre_row_fraction: 0.62
  max_centre_gap_px: 60.0
  max_time_gap_s: 0.6
  min_detections_per_track: 3
depth_radial_velocity:
  enabled: true
  max_dt_s: 0.20
  max_azimuth_difference_deg: 6.0
  max_altitude_difference_deg: 4.0
  max_abs_radial_velocity_mps: 60.0
  range_gate_margin_m: 0.50
  require_mutual_match: true
  max_velocity_jump_mps: 20.0
