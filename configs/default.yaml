simulation:
  host: "127.0.0.1"
  port: 2000
  timeout_s: 60.0
  synchronous_mode: true
  fixed_delta_seconds: 0.05
  substepping: true
  max_substep_delta_time: 0.01
  max_substeps: 10
  traffic_manager_enabled: true
  traffic_manager_port: 8000
  map_switch_settle_s: 60.0
  spawn_z_offset: 0.3
  warmup_ticks: 20
  min_spawn_gap_m: 5.0
  max_duration_s: 45.0
sensors:
  profile: "radar_baseline"
  camera:
    enabled: true
    sensor_id: "front_rgb"
    blueprint: "sensor.camera.rgb"
    width: 800
    height: 600
    fov_deg: 90.0
    sensor_tick_s: 0.0
    mount_x: 1.4
    mount_y: 0.0
    mount_z: 1.4
    mount_pitch_deg: 0.0
    mount_yaw_deg: 0.0
    mount_roll_deg: 0.0
  depth_camera:
    enabled: true
    sensor_id: "front_depth"
    blueprint: "sensor.camera.depth"
    width: 800
    height: 600
    fov_deg: 90.0
    sensor_tick_s: 0.0
    mount_x: 1.4
    mount_y: 0.0
    mount_z: 1.4
    mount_pitch_deg: 0.0
    mount_yaw_deg: 0.0
    mount_roll_deg: 0.0
