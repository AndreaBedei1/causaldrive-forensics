# =============================================================================
# carla-distributed-causal-forensics -- pipeline defaults
# =============================================================================
# Every threshold used anywhere in the pipeline lives in this file (or in a
# sensor/scenario file that overrides it). Nothing is hard-coded in the modules.
#
# Values marked "calibrated" were tuned against measured CARLA 0.9.15 radar
# output rather than copied from any reference implementation; see
# docs/EXPERIMENT_PROTOCOL.md for the calibration procedure.
# =============================================================================

schema_version: "1.0.0"

# -----------------------------------------------------------------------------
# Simulation
# -----------------------------------------------------------------------------
simulation:
  host: "127.0.0.1"
  port: 2000
  traffic_manager_port: 8000
  timeout_s: 60.0
  synchronous_mode: true
  fixed_delta_seconds: 0.05        # 20 Hz
  substepping: true
  max_substep_delta_time: 0.01
  max_substeps: 10
  # The server crashes if asked to load the map it is already running, so the
  # client switches maps only when the requested one differs (see world.py).
  map_switch_settle_s: 60.0
  spawn_z_offset: 0.3              # lift above the waypoint plane before spawning
  warmup_ticks: 20                 # ticks discarded before recording starts
  max_duration_s: 45.0             # hard cap per scenario run
  post_outcome_s: 5.0              # keep simulating this long after the outcome

# -----------------------------------------------------------------------------
# Participant recorder clocks (configurable experimental perturbations)
# -----------------------------------------------------------------------------
clocks:
  independent: true
  offset: { enabled: true, max_abs_s: 0.4 }
  drift: { enabled: true, max_abs_ppm: 100.0 }
  jitter: { enabled: false, std_s: 0.001 }

# -----------------------------------------------------------------------------
# Sensors (the radar block is replaced by the selected profile)
# -----------------------------------------------------------------------------
sensors:
  profile: "radar_baseline"

# -----------------------------------------------------------------------------
# Rolling forensic recorder (event-data-recorder analogue)
# -----------------------------------------------------------------------------
recorder:
  pre_event_s: 20.0                # rolling history retained before a trigger
  post_event_s: 5.0                # continued recording after a trigger
  sample_rate_hz: 20.0
  # Hard ceiling on retained samples; the ring buffer is sized from
  # pre_event_s * sample_rate_hz and never grows beyond it.
  max_radar_points_per_frame: 400
  triggers:
    collision:
      enabled: true
      min_impulse: 1.0             # N*s; below this the impact is ignored
      debounce_s: 0.5              # sustained contact emits one event per frame;
                                   # collapse them so one crash is one trigger
    near_miss:
      enabled: true
      ttc_s: 0.9                   # local TTC at or below this arms the trigger
      min_range_m: 12.0            # only when the target is genuinely close
    emergency_brake:
      enabled: true
      brake_cmd: 0.85
      decel_mps2: 5.5

# -----------------------------------------------------------------------------
# Radar signal processing -> clusters -> tracks
# -----------------------------------------------------------------------------
radar_processing:
  # --- plausibility filtering (calibrated: CARLA emits ~145 returns/frame, most
  #     from the road surface, plus a spurious ~100 m/s return on the first frame)
  filter:
    min_range_m: 1.5
    max_range_m: 90.0
    max_abs_velocity_mps: 60.0     # rejects the first-frame artifact
    min_altitude_rad: -0.05        # drop road-surface returns below the sensor plane
    max_altitude_rad: 0.25
    max_abs_azimuth_rad: 1.10      # slightly inside the nominal 120 deg FOV
  # --- world-fixed clutter rejection
  # A stationary point observed from a sensor moving at speed v produces a radial
  # velocity of exactly -v*cos(azimuth). Returns matching that prediction are the
  # road surface, kerbs, walls and parked objects. The test uses only own speed
  # and the sensor's own bearing/range-rate, so it stays local evidence, and it
  # gates track BIRTH only -- a tracked vehicle that brakes to a halt is kept.
  stationary:
    enabled: true
    tolerance_mps: 1.5
    reject_new_tracks: true
    max_stationary_frames: 40    # drop a track sustained only by world-fixed
                                 # returns for this many consecutive frames (2 s)

  # --- clustering of surviving returns (DBSCAN-like, in body-frame metres)
  cluster:
    eps_m: 2.2
    min_points: 3
    velocity_weight: 0.6           # range-rate is part of the distance metric
    max_clusters: 24
  # --- multi-frame tracking
  tracking:
    gate_m: 4.5                    # association gate around the predicted position
    max_misses: 6                  # frames without a detection before dropping
    min_hits_to_confirm: 3
    position_alpha: 0.55           # alpha-beta smoothing on position
    velocity_alpha: 0.35           # and on the derived velocity
    max_tracks: 16
    confidence:
      hit_gain: 0.16
      miss_decay: 0.22
      min_confirm: 0.35

# -----------------------------------------------------------------------------
# Derived local indicators
# -----------------------------------------------------------------------------
indicators:
  ttc:
    max_reportable_s: 12.0
  conflict:
    prediction_horizon_s: 4.0      # constant-velocity path prediction horizon
    prediction_step_s: 0.2
    min_own_speed_mps: 1.5         # below this a predicted path is meaningless
    min_target_speed_mps: 1.5
    region_radius_m: 6.0           # radius of the inferred conflict region
    max_arrival_gap_s: 2.5         # both parties reach the crossing within this

# -----------------------------------------------------------------------------
# Local event extraction (with hysteresis, to stop threshold chatter)
# -----------------------------------------------------------------------------
events:
  min_separation_s: 0.75           # debounce: same type+subject cannot repeat faster
  min_duration_s: 0.10
  hysteresis_ratio: 0.75           # an active event ends at ratio * enter-threshold

  vehicle_started:
    speed_mps: 0.8
  acceleration:
    enter_mps2: 1.5
  deceleration:
    enter_mps2: -1.8
  hard_deceleration:
    enter_mps2: -4.5
  brake_onset:
    brake_cmd: 0.12
  hard_brake:
    brake_cmd: 0.65
  throttle_onset:
    throttle_cmd: 0.25
  steer_onset:
    steer_cmd: 0.14
  heading_change:
    total_deg: 12.0
    window_s: 1.5
  lane_change_like:
    lateral_offset_m: 1.8          # lateral displacement w.r.t. own heading
    window_s: 3.0
    max_heading_change_deg: 45.0   # larger means a turn, not a lane change

  radar:
    range_decreasing:
      min_rate_mps: 1.0
      min_duration_s: 0.6
    rapid_closing:
      min_rate_mps: 6.0
    low_ttc:
      ttc_s: 3.0
    critical_ttc:
      ttc_s: 1.6
    lateral_crossing:
      min_lateral_rate_mps: 1.8
      max_range_m: 45.0
    cut_in_like:
      lateral_closing_mps: 1.2     # target moving toward own path centre-line
      max_lateral_offset_m: 4.5
      min_longitudinal_m: 4.0
      window_s: 2.5
    target_deceleration:
      min_decel_mps2: 2.5          # inferred from range-rate history
    path_conflict:
      min_confidence: 0.35
  outcome:
    post_impact_stop:
      speed_mps: 0.6
      within_s: 4.0

# -----------------------------------------------------------------------------
# Local causal rule engine (see src/cdf/local/causal_rules.py)
# -----------------------------------------------------------------------------
causal_rules:
  default_max_lag_s: 4.0           # cause must precede effect by at most this
  min_lag_s: -0.15                 # small negative lag tolerated (sampling jitter)
  min_edge_confidence: 0.25
  confidence:
    # Edge confidence = rule_prior * node_confidence_factor * temporal_factor
    temporal_decay_s: 3.0          # confidence falls off with the cause->effect lag
    node_weight: 0.6

# -----------------------------------------------------------------------------
# Post-event fusion
# -----------------------------------------------------------------------------
# What each vehicle perceives of the road, from its own camera and lane sensor.
# Nothing here reads the map: that is the point of having a camera at all. See
# cdf.local.sign_perception and cdf.local.lane_events.
perception:
  signs:
    min_area_px: 240               # smaller than this is a guess, not a reading
    min_fill_ratio: 0.80           # contour area over hull area, for a solid face
    min_redness: 0.28
    min_confidence: 0.45
    approx_epsilon: 0.025          # polygon simplification, fraction of perimeter
    min_saturation: 90
    min_value: 50
    max_centre_gap_px: 60.0        # association across frames
    max_time_gap_s: 0.6
    min_detections_per_track: 3
    # Bridge the white lettering and border so the red face reads as one octagon.
    # At 3 px the letters stayed as holes and the contour filled half its
    # bounding box against the 0.83 the classifier looks for.
    close_kernel_px: 9
    # A sign is on a post; bodywork is not. After a collision the struck car
    # fills the lower frame and a red rear reads as a give-way triangle.
    max_centre_row_fraction: 0.62    # a one-frame detection is likelier a red van
  lanes:
    merge_window_s: 0.8            # reports closer than this are one crossing
  stop_lines:
    roi_top_fraction: 0.55         # only the near road can hold a line to cross
    min_brightness: 165
    min_row_bright_fraction: 0.30
    min_width_fraction: 0.35       # transverse and broad, not a lane line
    min_rows: 3
    max_rows: 90                   # taller than this is a bright surface
    min_confidence: 0.40
    min_sightings: 3
    crossing_row_fraction: 0.80    # lost above this is lost, not crossed
    crossing_min_speed_mps: 0.5
    lost_after_s: 0.4              # timing uncertainty of the inference

# Normative reasoning. See cdf.responsibility: the priority benchmark is a rule
# adopted for this experiment, not a statement of law, and it is allowed to
# return AMBIGUOUS_PRIORITY rather than break a tie it cannot see.
responsibility:
  priority:
    clear_margin_s: 0.5            # closer than this is not "clearly first"

# Executable temporal logic. See cdf.formal: a window that ran outside the
# recording, or across a gap in the evidence, is UNKNOWN rather than PASS.
formal:
  min_evidence_coverage: 0.8

# Deriving "this did not happen" from onboard evidence. See
# cdf.graph.non_actions: a window whose evidence falls below the bar is
# reported UNKNOWN rather than resolved either way.
non_actions:
  min_evidence_coverage: 0.8

# The forward camera. Off is a supported configuration, not a degraded one: the
# V1 scenarios were recorded without one and stay runnable without one.
sensors:
  camera:
    enabled: true
    sensor_id: "front"
    width: 800
    height: 600
    fov_deg: 90.0
    mount_x: 1.4
    mount_z: 1.4
    jpeg_quality: 70
    pre_event_s: 20.0              # the window the brief asks for
    post_event_s: 5.0
    max_frames: 1200               # backstop against a broken clock
  # Marking crossings, treated as a simulated onboard ADAS signal. It reports
  # *that* a marking was crossed and what sort; it never says which lane the
  # vehicle is in or where that lane goes, which would be map knowledge.
  lane_invasion:
    enabled: true

fusion:
  # V2 primary clock method: shared physical contact. See
  # docs/CLOCKS.md and cdf.fusion.contact_alignment.
  # Final V2 clock policy: contact first, radar second, unresolved last. The
  # hierarchy is in cdf.fusion.hybrid_alignment; the two stages it selects
  # between are configured below under contact_alignment and time_alignment.
  hybrid_alignment:
    radar_fallback: true             # false reproduces the contact-only ablation
    radar_min_confidence: 0.4        # a poor fit is not evidence about a clock
    # Two independent pairings are two looks at one constant. If they disagree by
    # more than this the offset is not established and the recorder stays
    # unresolved, rather than the more confident one being believed on no stated
    # grounds. Averaging them is what produced +0.092 s on the recorded chain
    # from a true +0.267 s and a spurious -0.083 s.
    radar_max_disagreement_s: 0.15
  contact_alignment:
    max_separation_m: 12.0           # two recorders in one impact are this close
    # The harness gives each recorder an offset of at most clocks.offset.max_abs_s
    # (0.4 s), so two recorders cannot be more than 0.8 s apart. At 30 s the gate
    # admitted pairings between impacts that had nothing to do with each other --
    # on a no-collision run two vehicles each scraped something eight seconds
    # apart and the matcher related them, giving an offset 8.00 s wrong on a run
    # reported as CONTACT_ALIGNED. One second is the same bound the radar path
    # uses and is still generous against the declared 0.8.
    min_impulse_ratio: 0.05          # below this the two hits are not one hit
    ambiguity_margin: 0.12           # 2nd-best pairing within this => ambiguous
    consistency_margin: 0.12         # a contradicting link this much weaker loses
    max_offset_disagreement_s: 0.15  # 3 frames at 20 Hz
    trigger_merge_window_s: 0.3      # a sustained contact is one impact
    # Resting contact after a pile-up reports twice a second for the rest of the
    # run at a hundredth of the impact impulse. An anchor has to carry a real
    # share of the momentum transfer, or it is contact rather than an impact.
    min_impulse_fraction_of_peak: 0.05
    # A noise floor, not a resting-contact filter. Rejecting resting contact is
    # what min_impulse_fraction_of_peak is for, and it does it on the ratio: on
    # the recorded chain the resting reports were 30-290 N*s against a peak of
    # 11569, i.e. 0.003-0.025 of it, well under the 0.05 fraction. An absolute
    # floor of 300 additionally threw away real collisions that happened to be
    # gentle -- the all-way-stop merge impact measures 120.3 N*s and was being
    # read as "no recorder felt a contact", which dropped the whole run onto the
    # harness marker.
    min_impulse_ns: 50.0
    # The negative controls have no contact to anchor on. The fallback is an
    # explicit marker from the experiment harness, reported apart from
    # contact-aligned runs; it is never simulator time. See section 14 of the
    # brief and cdf.fusion.contact_alignment.align_by_acquisition_start.
    acquisition_start_fallback: true
  # Keep running the superseded radar estimator so the clock ablation can compare
  # the two. It no longer decides the timeline results are computed on.
  keep_radar_alignment_diagnostic: true
  # Superseded radar-based alignment, kept for the clock ablation only. It is no
  # longer the method the results are reported from; see docs/CLOCKS.md for why
  # a drift rate fitted to a 25 s window was more precision than the evidence.
  time_alignment:
    max_offset_s: 1.0
    grid_dt: 0.05
    max_drift_ppm: 2000.0
    min_samples: 12
    min_overlap_s: 1.0
    min_overlap_fraction: 0.6
    coarse_offset_step_s: 0.05
    min_confidence: 0.4
    ambiguity_margin: 0.12
    position_sigma_m: 2.0
    range_sigma_m: 2.0
    range_rate_sigma_mps: 1.5
    velocity_sigma_mps: 3.0
    min_drift_span_s: 15.0
    max_drift_uncertainty_ppm: 250.0
    min_drift_loss_improvement: 0.01
    max_interpolation_gap_s: 0.3
    collision_anchor_tolerance_s: 0.3
    collision_anchor_sigma_s: 0.03
    max_clock_constraint_residual_s: 0.2
    # Offset-only path: a radar return comes off the near surface, not the centre.
    # Unmodelled, that bias is paid for in the clock offset. Bounded by about half
    # a vehicle plus the sensor mount.
    max_surface_bias_m: 6.0
    coarse_surface_step_m: 0.5       # the coarse stage searches offset x bias jointly
  track_association:
    min_overlap_s: 1.0             # minimum temporal overlap to even consider
    max_rmse_m: 6.0                # gate on trajectory RMSE
    velocity_weight: 0.35
    heading_weight: 0.15
    position_weight: 0.50
    min_confidence: 0.40           # below this the assignment stays UNRESOLVED
    ambiguity_margin: 0.12         # 2nd-best within this margin => ambiguous
  event_alignment:
    time_tolerance_s: 1.0
    require_same_type: true
    subject_must_agree: true       # merged events must concern the same participant
    counterpart_max_time_gap_s: 0.5
    counterpart_max_range_m: 8.0
    counterpart_ambiguity_margin_m: 1.0
    # An impact is mutual. Two vehicles that each record one within this window,
    # while this close on the common clock, are two accounts of one impact --
    # which is how a vehicle struck from behind learns who struck it.
    mutual_impact_tolerance_s: 0.5
    mutual_impact_max_distance_m: 12.0
    mutual_impact_ambiguity_dt_s: 0.1   # a rival this much further away in time
                                        # is not the same impact, however close
  confidence_fusion:
    method: "noisy_or"             # documented in docs/GRAPH_FUSION.md
    cap: 0.99
  conflict:
    keep_contradictions: true      # never silently drop a disagreeing claim
  # Causal reasoning over the FUSED event set, once identities are resolved.
  # Local rules only fire when one vehicle saw both the cause and the effect;
  # these fire across logs (B's braking -> the gap A measured closing), which is
  # the whole point of exchanging the recordings. Turn it off to obtain the
  # "simple fusion" ablation: the union of the participants' own claims.
  post_fusion:
    enabled: true
    min_edge_confidence: 0.20
    min_lag_s: -0.15               # a cause may appear marginally after its
                                   # effect: event peaks are estimates
    max_clock_slack_s: 0.35        # extra tolerance, capped; the amount actually
                                   # used is the alignment's own residual
    max_new_edges: 4000
    confidence:
      node_weight: 0.6             # weight of the endpoint confidences
      temporal_decay_s: 3.0        # exp(-|lag|/tau)
      single_observer_factor: 0.85 # a claim no second vehicle corroborates
    overrides: {}                  # rule -> {enabled, prior, max_lag_s}

# -----------------------------------------------------------------------------
# Behavioural episodes, causal chains and the graph-derived reconstruction
# -----------------------------------------------------------------------------
graph:
  episodes:
    merge_gap_s: 1.5               # a brake command and the deceleration it
                                   # produced are one act, not two
    late_response_margin_s: 0.0    # braking after one own critical TTC is late
    no_response_window_s: 2.5      # window for "did this vehicle respond at all"
  reconstruction:
    max_chains_per_outcome: 8
    max_chain_length: null         # null = no cutoff on path length
  attribution:
    min_chain_confidence: 0.15     # below this a chain does not support a claim

# -----------------------------------------------------------------------------
# Finite-trace model checking
# -----------------------------------------------------------------------------
checking:
  P1_brake_response:
    ttc_critical_s: 1.6
    response_window_s: 1.2
    brake_cmd: 0.25
  P2_no_throttle_while_closing:
    closing_rate_mps: 5.0
    grace_s: 1.0
    throttle_cmd: 0.20
  P3_post_collision_stop:
    window_s: 3.0
    max_throttle: 0.05
    stop_speed_mps: 1.0
  P4_conflict_without_response:
    lookahead_s: 3.0
    min_evasive_brake: 0.2
    min_evasive_steer: 0.15

# -----------------------------------------------------------------------------
# Counterfactual replays
# -----------------------------------------------------------------------------
counterfactual:
  max_interventions: 8
  # Supplying a behaviour that did not happen, to test whether an omission
  # mattered. See cdf.causal.interventions.omission_repairs: a repair is
  # proposed only for a non-action the reconstruction actually supports, which
  # is what separates it from adding safe behaviour to any run.
  omission_repair:
    min_confidence: 0.8            # a hedged omission does not support a claim
    lead_in_s: 0.6                 # a stop made as the window opens is too late
  # Restart the simulator before each replay. A counterfactual is a comparison,
  # and repeated runs on one server session drift enough to change an outcome
  # class (docs/ENVIRONMENT.md), which would confound the very difference being
  # measured. Costs ~45 s per replay.
  restart_server_per_replay: true
  # Reuse a replay that already completed under this same configuration instead
  # of simulating it again. Each replay is an independent server session by
  # construction, so resuming costs nothing in comparability, and an
  # interrupted campaign does not have to repeat the hour it already spent.
  # Set to false to force every replay to be recorded afresh.
  resume: true
  # Multi-action replay. Two vehicles can each contribute without either being
  # individually decisive; only removing both in one replay can tell that apart
  # from an absence of evidence. Runs only when no single removal prevented the
  # collision, and stops at the first size that does -- which is what makes the
  # set it reports minimal.
  combinations:
    enabled: true
    max_combination_size: 2        # with two or three vehicles, pairs suffice
    max_replays: 6                 # hard ceiling on the extra replays
  severity_metric: "relative_impact_speed"
  contribution:
    # Normalised causal-contribution score; formula documented in
    # docs/CAUSAL_MODEL.md. It is explicitly NOT a legal fault percentage.
    prevention_weight: 1.0
    severity_weight: 0.5
    min_severity_reduction: 0.05   # below this a replay did not measurably change
                                   # the severity, and nothing is claimed

# -----------------------------------------------------------------------------
# Evaluation
# -----------------------------------------------------------------------------
evaluation:
  # Report the structural comparison a second time in the canonical vocabulary
  # (cdf.graph.canonical), so that the same claim written in the oracle's terms
  # and in the reconstruction's terms can match. Strictly weaker than the strict
  # comparison, which stays the headline number; never applied to an artifact.
  canonical_vocabulary:
    enabled: true
  event_match:
    time_tolerance_s: 1.5
    require_same_type: true
  graph_match:
    # Whether to score structure only over the node skeleton both graphs share.
    #
    # This MUST stay false for the headline metrics. With it true, an oracle edge
    # touching a node the reconstruction never found is excluded instead of
    # counted as missing -- so a participant that observed one third of a crash
    # reports perfect edge recall on the third it saw, and the fused graph cannot
    # score better than it. That makes the fusion-benefit measurement (H1/H2)
    # identically zero by construction. Counted honestly, a missed causal claim
    # is a false negative.
    #
    # The shared-skeleton convention is still available per call, and
    # match_edges always reports n_touching_unmatched_* so the two conventions
    # can be reconciled after the fact.
    use_matched_nodes_only: false
  association:
    count_unresolved_as_miss: true
  # Scene reconstruction: how close the merged account puts the vehicles and the
  # impact to the truth, in metres and seconds on the simulator clock.
  reconstruction:
    max_pose_gap_s: 0.10         # no privileged pose within this of a sample
                                 # means that sample is not scored, rather than
                                 # scored against a stale pose
  # Causal chains into the collision, compared by canonical family signature.
  causal_paths:
    max_paths_per_outcome: 64    # a dense graph can carry combinatorially many
                                 # paths; the cap is recorded with the result

# -----------------------------------------------------------------------------
# Output
# -----------------------------------------------------------------------------
output:
  artifacts_root: "artifacts"
  write_graphml: true
  write_figures: true
  write_viewer_bundle: true
  compress_raw: true
