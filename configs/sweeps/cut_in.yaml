sweep:
  name: cut_in
  scenario: S02
  base_variant: crash
  seed: 202
  description: >
    B, slower, cuts from the left lane into A's lane ahead of A, then slows; A brakes late.  The gap, B's
    speed, the moment of the cut-in and A's braking vary: rear-end crashes, near misses and safe stops.
  parameters:
  - path: participants.B.spawn.forward_m
    low: 22.0
    high: 36.0
    decimals: 1
  - path: participants.B.initial_speed
    low: 7.0
    high: 11.0
    decimals: 1
    also: [participants.B.target_speed]
  - path: participants.B.actions.B_cut_in.t_start
    low: 0.5
    high: 2.0
    decimals: 2
  - path: participants.A.actions.A_late_brake.t_start
    low: 2.6
    high: 4.6
    decimals: 2
