sweep:
  name: anonymous_pair_adjacent
  scenario: S18
  base_variant: abreast
  seed: 505
  description: >
    The non-recording C and D in adjacent lanes ahead of the recorders, D's longitudinal offset from C and
    its speed varied (abreast, passing, staggered); A drifts into B for the alignment.  The fusion must
    keep C and D apart.
  parameters:
  - path: participants.D.spawn.forward_m
    low: -6.0
    high: 6.0
    decimals: 2
    relative_to: participants.C.spawn.forward_m
  - path: participants.D.initial_speed
    low: 11.0
    high: 13.0
    decimals: 2
    also: [participants.D.target_speed]
  - path: participants.B.spawn.forward_m
    low: 10.5
    high: 14.5
    decimals: 1
