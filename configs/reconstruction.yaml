# Local-graph -> global-graph reconstruction (src/cdf/reconstruction).
# Defaults were checked on S01-S03 crash runs; see src/cdf/reconstruction/config.py.
reconstruction:
  trace_hz: 10                        # readable local trace rate (local clock)

  collision:
    # One COLLISION per contact. Callbacks without a missing sample between them form a burst;
    # a burst after a pause > merge_gap_s starts a new contact; after a shorter break (>= 1 sample
    # without callback) its peak relative to the current contact's peak decides.
    merge_gap_s: 0.5                  # a longer pause always separates two contacts
    new_impact_ratio: 0.75            # >= this: a new impact (rebounds measured <= 0.52, second bodies 0.85-0.93)
    min_impact_ratio: 0.25            # < this: the same contact (persistent contact <= 0.25)
    # In between: the recorder's own velocity jumps at the contact's start and at the burst, when both
    # are impact-like, decide: > reversal_angle_deg apart = struck from the other side (new),
    # otherwise a rebound (same). Without that evidence: new from undirected_impact_ratio.
    impact_acceleration_mps2: 20.0    # impact-like jump: mean |dv|/dt over the samples around the callback (~2 g)
    reversal_angle_deg: 90.0
    undirected_impact_ratio: 0.5

  tracking:
    min_height_m: 0.3                 # returns below: road surface
    max_height_m: 2.5                 # returns above: signs, bridges, trees
    moving_speed_mps: 1.0             # own line-of-sight speed that makes a return "moving"
    cluster_distance_m: 2.0           # moving returns closer than this = one candidate object
    max_association_distance_m: 2.5   # gate around a track's predicted position
    max_velocity_mismatch_mps: 4.0    # Doppler gate around the track's predicted radial speed
    max_track_gap_s: 0.5              # a silent track is ended after this
    min_track_frames: 5               # radar sweeps with moving returns before a track is reported
    measurement_std_m: 0.5            # Kalman: median-return position noise
    radial_speed_std_mps: 0.3         # Kalman: median Doppler speed noise
    acceleration_std_mps2: 6.0        # Kalman: unmodelled acceleration (emergency braking)

  semantics:
    brake_onset_threshold: 0.1        # BRAKE_START at or above, BRAKE_END below (0.2 s release debounce)
    full_stop_speed_mps: 0.3          # STOP_START below; moving again above 1 m/s
    speed_limit_hysteresis_kmh: 1.0   # exceeding: above limit + 1 km/h, ends at or below limit - 1 km/h
    closing_speed_threshold_mps: 1.0  # CLOSING_START at or above, CLOSING_END below half of it
    # CRITICAL_TTC (while closing): avoiding the target by braking needs at least the available
    # deceleration, i.e. TTC <= reaction + v_shed / (2 a) + margin / v_shed (see README).
    critical_reaction_time_s: 1.0     # the recorder reacts after this time (driver brake reaction ~0.7-1.5 s)...
    critical_deceleration_mps2: 6.0   # ...then brakes at up to this (hard, non-emergency; emergency ~8-10)...
    critical_standstill_margin_m: 1.0 # ...keeping at least this distance to the target
    critical_release_ratio: 0.75      # CRITICAL_TTC_END once the required deceleration < 75 % of the available
    # TURN_LEFT / TURN_RIGHT from the recorder's own unwrapped heading (never from the steer command)
    turn_yaw_rate_window_s: 0.2       # yaw rate = heading change over this preceding window (causal)
    turn_yaw_rate_on_dps: 10.0        # TURN_*_START at or above (lane changes peak below ~9 deg/s)...
    turn_yaw_rate_off_dps: 5.0        # ...TURN_*_END below this (hysteresis)
    turn_min_speed_mps: 1.0           # no turn while slower than this
    turn_release_debounce_s: 0.3      # a dip below the off threshold shorter than this does not end the turn
    turn_min_duration_s: 0.5          # a turn lasts at least this long...
    turn_min_heading_change_deg: 15.0 # ...and changes the heading by at least this (lane changes <= ~10 deg)
    path_half_width_m: 1.5            # straight-ahead corridor for EGO_PATH_ENTRY / EXIT (from the front edge)
    track_appeared_front_deg: 5.0     # TRACK_APPEARED_FRONT within this first azimuth...
    track_appeared_rear_deg: 5.0      # ...TRACK_APPEARED_REAR within this of straight behind, else _LEFT / _RIGHT
    max_position_std_m: 1.0           # track estimates more uncertain than these (Kalman std)...
    max_velocity_std_mps: 1.0         # ...leave CUT_IN UNKNOWN
    cut_in_max_heading_deg: 25.0      # CUT_IN: target moves within this angle of the recorder's heading
    cut_in_min_target_speed_mps: 2.0  # ...at least this fast (a slow or standing object does not cut in)
    cut_in_lateral_speed_mps: 0.3     # ...approaching the corridor laterally at least this fast
    cut_in_persistence_s: 0.5         # ...without interruption for this long
    cut_in_outside_margin_m: 0.5      # ...starting at least this far outside the corridor
    cut_in_min_displacement_m: 0.5    # ...having closed at least this much laterally
    cut_in_horizon_s: 3.0             # ...and due to reach the corridor within this lateral time
    cut_in_settle_speed_mps: 0.2      # CUT_IN_END: lateral approach below this...
    cut_in_settle_s: 0.3              # ...for this long

  fusion:
    impulse_tolerance: 0.10           # same contact if peak impulses differ by <= 10 %
    clock_tolerance_s: 0.1            # matches between graphs already linked must agree on the clock offset
    contact_window_s: 1.0             # a partner track may be lost up to this long before the contact (association only)
    contact_range_m: 3.5              # clearance at the contact counts fully up to this (evidence, not a veto)...
    contact_range_scale_m: 3.0        # ...and lowers the confidence beyond it with this scale
    approach_window_s: 1.0            # the range must shrink over this last stretch before the contact
    min_track_persistence_s: 1.0      # tracked at least this long before the contact
    speed_consistency_mps: 1.5        # track speed vs partner's own speed (RMSE)
