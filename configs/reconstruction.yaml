# Local-graph -> global-graph reconstruction (src/cdf/reconstruction).
# Defaults were checked on S01-S03 crash runs; see src/cdf/reconstruction/config.py.
reconstruction:
  trace_hz: 10                        # readable local trace rate (local clock)

  collision:
    merge_gap_s: 0.5                  # callbacks closer than this = one contact episode

  tracking:
    min_height_m: 0.3                 # returns below: road surface
    max_height_m: 2.5                 # returns above: signs, bridges, trees
    moving_speed_mps: 1.0             # own line-of-sight speed that makes a return "moving"
    cluster_distance_m: 2.0           # moving returns closer than this = one candidate object
    max_association_distance_m: 2.5   # gate around a track's predicted position
    max_velocity_mismatch_mps: 4.0    # Doppler gate around the track's predicted radial speed
    max_track_gap_s: 0.5              # a silent track is ended after this
    min_track_frames: 5               # radar sweeps with moving returns before a track is reported
    measurement_std_m: 0.5            # Kalman: median-return position noise
    radial_speed_std_mps: 0.3         # Kalman: median Doppler speed noise
    acceleration_std_mps2: 6.0        # Kalman: unmodelled acceleration (emergency braking)

  semantics:
    brake_onset_threshold: 0.1        # BRAKE_START at or above, BRAKE_END below (0.2 s release debounce)
    hard_brake_threshold: 0.9         # HARD_BRAKE_START / HARD_BRAKE_END
    strong_throttle_threshold: 0.8    # STRONG_THROTTLE_START / STRONG_THROTTLE_END
    full_stop_speed_mps: 0.3          # STOP_START below; moving again above 1 m/s
    speed_limit_hysteresis_kmh: 1.0   # exceeding: above limit + 1 km/h, ends at or below limit - 1 km/h
    closing_speed_threshold_mps: 1.0  # CLOSING_START at or above, CLOSING_END below half of it
    critical_ttc_s: 2.0               # CRITICAL_TTC_START at or below (while closing)
    path_half_width_m: 1.5            # straight-ahead corridor for EGO_PATH_ENTRY / EGO_PATH_EXIT
    max_position_std_m: 1.0           # track estimates more uncertain than these (Kalman std)...
    max_velocity_std_mps: 1.0         # ...leave PATH_CONFLICT and CUT_IN UNKNOWN
    conflict_horizon_s: 4.0           # PREDICTED_PATH_CONFLICT_START: closest approach due within this...
    conflict_distance_m: 1.5          # ...with a predicted miss distance at or below this
    conflict_release_horizon_s: 5.0   # _END: closest approach past, later than this...
    conflict_release_distance_m: 2.5  # ...or predicted miss distance above this
    cut_in_max_heading_deg: 25.0      # CUT_IN: target moves within this angle of the recorder's heading
    cut_in_min_target_speed_mps: 2.0  # ...at least this fast (a slow or standing object does not cut in)
    cut_in_lateral_speed_mps: 0.3     # ...approaching the corridor laterally at least this fast
    cut_in_persistence_s: 0.5         # ...without interruption for this long
    cut_in_outside_margin_m: 0.5      # ...starting at least this far outside the corridor
    cut_in_min_displacement_m: 0.5    # ...having closed at least this much laterally
    cut_in_horizon_s: 3.0             # ...and due to reach the corridor within this lateral time
    cut_in_settle_speed_mps: 0.2      # CUT_IN_END: lateral approach below this...
    cut_in_settle_s: 0.3              # ...for this long

  fusion:
    impulse_tolerance: 0.10           # same contact if peak impulses differ by <= 10 %
    contact_window_s: 0.5             # a track must be seen this close to the collision...
    contact_range_m: 3.5              # ...at this range or less, to be the collision partner
    min_track_persistence_s: 1.0      # and tracked at least this long before it
    speed_consistency_mps: 1.5        # track speed vs partner's own speed (RMSE)
