scenario:
  scenario_id: S17
  name: occlusion_reappearance
  description: 'Dense three-lane traffic.  The recorder A drives in the right lane, the recorder B in the left lane
    slightly ahead and slower; a van V in the middle lane between them hides B from A for the first seconds.  V
    then accelerates and draws ahead, B re-appears to A, and later A and B both move into the middle lane at the
    same time and collide (the only contact).  Similar cars drive around them; the two following cars brake for
    the crash ahead.  A correct reconstruction recovers the same identity for B before and after the occlusion (the
    earlier part from the later, clearer evidence where possible) instead of two road users or the wrong one, and
    names the contact partner.

    '
  research_question: Does an identity survive an occlusion and re-appearance among similar cars, up to a collision?
  map: Town05
  context:
    road_environment: urban arterial, three lanes one direction
    speed_limit_kmh: 50
  max_duration_s: 12.0
  default_variant: occlusion_reappearance
  participants:
  - id: A
    blueprint: vehicle.audi.tt
    spawn:
      anchor: spawn_index
      index: 265
      forward_m: 20.0
      lane_offset: 1
    route:
      length_m: 260.0
      step_m: 2.0
    initial_speed: 12.0
    target_speed: 12.0
    post_impact_mode: stop
    actions:
    - action_id: A_moves_left
