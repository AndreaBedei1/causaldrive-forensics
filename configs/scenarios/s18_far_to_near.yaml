scenario:
  scenario_id: S18
  name: far_to_near
  description: 'Dense three-lane traffic.  Far ahead (about 70 m) two similar cars drive slowly side by side: C
    in the middle lane and D in the right lane, both at 6 m/s.  The recorders A (middle lane) and B (left lane,
    abreast of A) close in at 13 m/s; at first C and D are distant, not closing fast enough to matter, and hard
    to tell apart.  As A approaches, C becomes a hazard for A; A swerves left to avoid it and collides with B (the
    only contact).  The right lane is a slow lane at 6 m/s, overtaken by A and B.  A correct reconstruction may
    leave the far identities unresolved at first, resolves them as the cars come close, carries that identity back
    to the earlier observations of the same track where the evidence allows, never invents an earlier observation,
    and keeps C and D apart.

    '
  research_question: Do identities that are ambiguous far away become resolved as targets approach, and can that
    later evidence resolve the earlier observations without moving any timestamp?
  map: Town05
  context:
    road_environment: urban arterial, three lanes one direction
    speed_limit_kmh: 50
  max_duration_s: 12.0
  default_variant: far_to_near
  participants:
