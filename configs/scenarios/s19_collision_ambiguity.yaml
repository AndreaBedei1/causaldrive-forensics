scenario:
  scenario_id: S19
  name: collision_ambiguity
  description: 'Dense three-lane traffic at 11 m/s.  The recorder B drives in the middle lane between two similar
    cars, C (left lane) and D (right lane), abreast of it with about 1.6 m between the bodies.  The recorder A,
    behind B in the middle lane and 2 m/s faster, closes in and hits B from behind (the only contact).  Two more
    cars drive abreast of A, two further ahead.  With consumer-grade GNSS the contact point is compatible with B,
    C or D; A''s own radar shows which body arrived at its front.  A correct reconstruction pairs the two collision
    reports, names B as the partner, keeps C and D apart from B, and leaves the partner unmatched rather than guessing
    when the evidence does not decide.

    '
  research_question: When several similar cars are within the pose uncertainty of a contact, does the collision
    association follow the radar history rather than GNSS proximity?
  map: Town05
  context:
    road_environment: urban arterial, three lanes one direction
    speed_limit_kmh: 50
  max_duration_s: 12.0
  default_variant: collision_ambiguity
