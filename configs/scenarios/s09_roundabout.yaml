simulation:
  traffic_manager_enabled: false
scenario:
  scenario_id: S09
  name: roundabout
  description: 'A is already circulating inside the roundabout on the outer circulating
    lane. B approaches from the south entry, fails to give way, and collides with
    A while entering the circulating area.  Both start about 8 s (67 m) further back
    along their routes than the conflict needs, so the run records a normal approach
    before the first critical situation.

    '
  map: Town03_Opt
  context:
    road_environment: urban roundabout
    speed_limit_kmh: 50
  default_variant: merge_conflict
  max_duration_s: 30.0
  participants:
  - id: A
    blueprint: vehicle.tesla.model3
    spawn:
      anchor: location
      x: 3.0
      y: -23.0
      # 66.9 m of route earlier (8.4 s at 8 m/s), still on the circulating lane;
      # the route from there contains the original one unchanged.
      forward_m: -62.0
    route:
      length_m: 190.0
      step_m: 2.0
      turns:
      - straight
      - straight
    initial_speed: 8.0
    target_speed: 8.0
    actions: []
  - id: B
    blueprint: vehicle.audi.tt
    spawn:
      anchor: junction_approach
      junction_x: 0.0
      junction_y: 0.0
      bearing_deg: 90.0
      back_m: 35.0
      forward_m: -68.0  # 67.8 m of route earlier, the same 8.4 s as A
    route:
      length_m: 190.0
      step_m: 2.0
      turns:
      - straight
      - straight
    initial_speed: 8.0
    target_speed: 8.0
    actions:
    - action_id: B_fail_to_give_way
      kind: set_speed
      t_start: 9.4
      duration: 14.0
      params:
        target_speed: 9.5
  variants:
    merge_conflict: {}
