scenario:
  scenario_id: S05
  name: simultaneous_crossing
  description: 'A and B approach the same unsignalised junction from perpendicular
    directions at comparable speeds and neither yields. Both arrive at the conflict
    region at essentially the same moment.

    '
  map: Town05
  default_variant: crash
  max_duration_s: 28.0
  participants:
  - id: A
    blueprint: vehicle.tesla.model3
    spawn:
      anchor: junction_approach
      junction_x: 101.6
      junction_y: 0.3
      bearing_deg: 0.0
      back_m: 40.0
    route:
      length_m: 110.0
      step_m: 2.0
      turns:
      - straight
    initial_speed: 11.0
    target_speed: 11.0
    actions:
    - action_id: A_no_yield
      kind: set_speed
      t_start: 0.5
      duration: 14.0
      params:
        target_speed: 11.5
  - id: B
    blueprint: vehicle.audi.tt
    spawn:
      anchor: junction_approach
      junction_x: 101.6
      junction_y: 0.3
      bearing_deg: -90.0
      back_m: 42.0
    route:
      length_m: 110.0
      step_m: 2.0
      turns:
      - straight
    initial_speed: 11.0
    target_speed: 11.0
    actions:
    - action_id: B_no_yield
      kind: set_speed
      t_start: 0.5
      duration: 14.0
      params:
        target_speed: 11.5
  variants:
    crash: {}
