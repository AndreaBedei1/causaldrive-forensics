# =============================================================================
# S12 -- ALL-WAY STOP  (2 vehicles)
# =============================================================================
# Both approaches are controlled, so stopping is no longer the question -- both
# vehicles are obliged to stop, and in three of the four variants both do. What
# has to be decided instead is who then had priority, and that is the first
# question in this project whose honest answer is sometimes "cannot be decided".
#
# The near_simultaneous variant exists specifically to be undecidable. Two
# vehicles that completed their stops a tenth of a second apart did not arrive in
# a clear order, and no amount of reconstruction quality changes that; the
# benchmark returns AMBIGUOUS_PRIORITY and the obligations layer records it.
# A method tuned to always produce a verdict would score *better* on a naive
# metric here while being wrong, which is why the variant is in the set.
#
# Note also what stays separate. In a_arrives_first the stopping property passes
# for both vehicles and the priority property fails for one. Collapsing those
# into a single "did the vehicle behave correctly" verdict would lose exactly the
# distinction this scenario is built to expose.
#
# Junction 720 of Town05 at (101.6, 0.3), as S10 and S11.
# =============================================================================

scenario:
  scenario_id: "S12"
  name: "all_way_stop"
  description: >
    Both A and B face stop signs. Variants differ in who stops first, whether the
    two arrivals are distinguishable at all, and whether one vehicle stops.
  map: "Town05"
  default_variant: "a_arrives_first"
  # The encounter is decided by about 13 s. Recording longer only lets the
  # route follower run out of road: at 32 s both vehicles reached the end of a
  # 110 m route and spiralled, which is what the accumulated-yaw check now
  # refuses.
  max_duration_s: 18.0

  participants:
    - id: "A"
      blueprint: "vehicle.tesla.model3"
      spawn:
        anchor: "junction_approach"
        junction_x: -283.42
        junction_y: 1.23
        bearing_deg: 180.0
        # 66 m back from the junction *centre*, and the centre is what back_m
        # measures from. Junction 1930's bounding box is 51 m wide, so its
        # eastern edge is 25 m from that centre and a 46 m spawn left A only
        # 18 m of approach: at 9 m/s it reached the junction in two seconds,
        # which is why it was still braking after it had entered. 66 m gives a
        # 33 m run-up, so the stop is made on the approach where a person
        # watching expects it.
        back_m: 66.0
        # The stem has a left-turn lane and a right-turn lane, and each is
        # committed: neither offers a choice at the junction, so the lane is
        # the turn. lane_offset -1 is the left-turn lane, and a left turn is
        # what crosses B. On the right-turn lane A merged onto B's road
        # travelling the same way and the two never conflicted at all.
        lane_offset: -1
      # turns is kept for readability; this junction never consults it, because
      # the lane has already decided.
      route:
        length_m: 240.0
        step_m: 2.0
        turns: ["left"]
        turn_lookahead: true
      initial_speed: 9.0
      target_speed: 9.0
      actions: []

    - id: "B"
      blueprint: "vehicle.audi.tt"
      spawn:
        anchor: "junction_approach"
        junction_x: -283.42
        junction_y: 1.23
        bearing_deg: -90.0
        # 50, not 62: measured, not computed. This arm quantises hard, and
        # 50 is what puts B at (-265.20, 47.78) on the lane it actually
        # drives, 31 m from its line. At 62 it sat 10 m further back and
        # its stop completed a second after A's, in a scenario about them
        # completing together.
        back_m: 50.0
      route:
        length_m: 240.0
        step_m: 2.0
        turns: ["straight"]
        turn_lookahead: true
      initial_speed: 9.0
      target_speed: 9.0
      actions: []

  traffic_control:
    signs:
      - sign_id: "stop_A"
        kind: "stop"
        governs: "A"
        anchor:
          anchor: "junction_approach"
          junction_x: -283.42
          junction_y: 1.23
          bearing_deg: 180.0
          # 29 puts the line at (-254.35, -0.33), 3.5 m clear of the
          # junction edge at x = -257.9. At 26 it sat 1.5 m clear, and a
          # variant braking a fifth of a second later stopped inside the
          # junction.
          back_m: 29.0
        # The map renders a real stop sign on this approach, so none is
        # spawned. place_traffic_control verifies the mesh is there and
        # records physically_present from what it found, not from this
        # declaration.
        spawn_prop: false
        stop_line_forward_m: 4.0
      - sign_id: "stop_B"
        kind: "stop"
        governs: "B"
        anchor:
          anchor: "junction_approach"
          junction_x: -283.42
          junction_y: 1.23
          bearing_deg: -90.0
          back_m: 22.0
        # The map renders a real stop sign on this approach, so none is
        # spawned. place_traffic_control verifies the mesh is there and
        # records physically_present from what it found, not from this
        # declaration.
        spawn_prop: false
        stop_line_forward_m: 4.0
    # Null on purpose, and in every variant. A right-side convention would
    # resolve the near-simultaneous case, and applying one the experiment has
    # not declared would put a jurisdiction's rule into results that name none.
    tie_break: null

  expected_outcome: "near_miss"
  expected_collision_pairs: []

  validation:
    encounter_pair: ["A", "B"]
    # Both vehicles must come to rest at their own stop line and outside the
    # junction. "It stopped" is not the claim an all-way stop makes; stopping
    # before the line is.
    stop_point:
      A: { x: -254.35, y: -0.33, max_distance_m: 6.0 }
      B: { x: -265.20, y: 16.50, max_distance_m: 6.0 }
    collision_near:
      x: -266.5
      y: 4.0
      max_distance_m: 10.0
      require_in_junction: true
    max_accumulated_turn_deg: 160.0
    min_straightness: 0.55
    no_scenery_collision: true
    min_separation_below_m: 16.0

  intervention_candidates:
    - "A_stop"
    - "B_stop"

  design_template:
    - cause: { kind: "state", participant: "A", name: "stopped" }
      effect: { kind: "outcome", name: "no_collision", participants: ["A", "B"] }
      edge: "PREVENTS"
    - cause: { kind: "state", participant: "B", name: "stopped" }
      effect: { kind: "outcome", name: "no_collision", participants: ["A", "B"] }
      edge: "PREVENTS"

  notes:
    - "both approaches controlled, so the benchmark falls to arrival order"
    - "no tie-break is configured in any variant, so a close arrival stays ambiguous"

  variants:
    # ---- A stops clearly first, and goes first: correct ------------------
    a_arrives_first:
      participant_overrides:
        A:
          actions:
            - action_id: "A_stop"
              kind: "brake"
              t_start: 2.7
              duration: 3.8
              params: { intensity: 0.9 }
            - action_id: "A_proceed"
              kind: "set_speed"
              t_start: 6.5
              duration: 8.0
              params: { target_speed: 8.0 }
        B:
          # The later arrival, and the reason the variant has a name. At the
          # shared 9 m/s both vehicles reached their lines within a tenth of a
          # second of each other and the benchmark rule -- priority to whoever
          # completed its stop first, by a clear margin -- had nothing to
          # separate. Approaching at 6 m/s and braking later puts this one about
          # 1.7 s behind, which clears the 0.5 s margin with room to spare.
          initial_speed: 6.0
          target_speed: 6.0
          actions:
            - action_id: "B_stop"
              kind: "brake"
              t_start: 4.4
              duration: 6.1
              params: { intensity: 0.9 }
            - action_id: "B_proceed"
              kind: "set_speed"
              t_start: 10.5
              duration: 6.0
              params: { target_speed: 8.0 }
      notes:
        - "A completes its stop about 1.7 s before B, which clears the margin"
        - "A then proceeds first, so both the stopping and the priority properties pass"

    # ---- B stops clearly first, and goes first: correct, mirrored --------
    b_arrives_first:
      participant_overrides:
        A:
          # The later arrival, and the reason the variant has a name. At the
          # shared 9 m/s both vehicles reached their lines within a tenth of a
          # second of each other and the benchmark rule -- priority to whoever
          # completed its stop first, by a clear margin -- had nothing to
          # separate. Approaching at 6 m/s and braking later puts this one about
          # 1.7 s behind, which clears the 0.5 s margin with room to spare.
          initial_speed: 6.0
          target_speed: 6.0
          actions:
            - action_id: "A_stop"
              kind: "brake"
              t_start: 4.4
              duration: 6.1
              params: { intensity: 0.9 }
            - action_id: "A_proceed"
              kind: "set_speed"
              t_start: 10.5
              duration: 6.0
              params: { target_speed: 8.0 }
        B:
          actions:
            - action_id: "B_stop"
              kind: "brake"
              t_start: 2.7
              duration: 3.8
              params: { intensity: 0.9 }
            - action_id: "B_proceed"
              kind: "set_speed"
              t_start: 6.5
              duration: 8.0
              params: { target_speed: 8.0 }

    # ---- neither arrival is clearly first --------------------------------
    near_simultaneous:
      expected_outcome: "collision"
      expected_collision_pairs: [["A", "B"]]
      validation:
        encounter_pair: ["A", "B"]
        min_separation_below_m: 6.0
      intervention_candidates:
        - "A_stop"
        - "B_stop"
        - "A_proceed"
        - "B_proceed"
      participant_overrides:
        A:
          actions:
            - action_id: "A_stop"
              kind: "brake"
              t_start: 2.7
              duration: 4.3
              params: { intensity: 0.95 }
            - action_id: "A_proceed"
              kind: "set_speed"
              t_start: 7.0
              duration: 8.0
              params: { target_speed: 8.0 }
        B:
          actions:
            - action_id: "B_stop"
              kind: "brake"
              t_start: 2.8
              duration: 4.2
              params: { intensity: 0.95 }
            - action_id: "B_proceed"
              kind: "set_speed"
              t_start: 7.0
              duration: 8.0
              params: { target_speed: 9.5 }
      design_template:
        - cause: { kind: "state", participant: "A", name: "conflict_entry" }
          effect: { kind: "outcome", name: "collision", participants: ["A", "B"] }
          edge: "CAUSES_OUTCOME"
        - cause: { kind: "state", participant: "B", name: "conflict_entry" }
          effect: { kind: "outcome", name: "collision", participants: ["A", "B"] }
          edge: "CAUSES_OUTCOME"
      notes:
        - "both stopped correctly, 0.1 s apart, and both then pulled away together"
        - "the designed answer is AMBIGUOUS_PRIORITY: the stopping properties pass and priority cannot be decided"
        - "a method that always produces a priority verdict scores better here while being wrong"

    # ---- one vehicle does not stop at all --------------------------------
    b_fails_to_stop:
      expected_outcome: "collision"
      expected_collision_pairs: [["A", "B"]]
      validation:
        encounter_pair: ["A", "B"]
        min_separation_below_m: 6.0
        # Only A stops here. Asking B for a stop would be asking the variant
        # not to happen.
        stop_point:
          A: { x: -254.35, y: -0.33, max_distance_m: 6.0 }
          B: null
      intervention_candidates:
        - "A_stop"
        - "B_roll_through"
      participant_overrides:
        A:
          actions:
            - action_id: "A_stop"
              kind: "brake"
              t_start: 2.7
              duration: 5.1
              params: { intensity: 0.9 }
            # A waits a moment longer at the line than in the other variants.
            # At 7.0 it crossed B's lane a second before B got there and the
            # two missed by 3.2 m; the point of this variant is that B does not
            # stop, so A has to still be crossing when B arrives.
            - action_id: "A_proceed"
              kind: "set_speed"
              t_start: 7.8
              duration: 8.0
              params: { target_speed: 8.0 }
        B:
          # 80 m back rather than 62. B does not stop here, so at the shared
          # spawn it would cross the junction at about 5 s and be gone long
          # before A pulled out at 7 s. Starting further back makes it arrive
          # while A is crossing, without pretending B approaches unusually
          # slowly.
          spawn:
            anchor: "junction_approach"
            junction_x: -283.42
            junction_y: 1.23
            bearing_deg: -90.0
            back_m: 80.0
          actions:
            # 5 m/s: slow enough that B is still crossing when A pulls out,
            # and slow enough to read as a vehicle rolling a stop rather than
            # one that simply never saw it.
            - action_id: "B_roll_through"
              kind: "set_speed"
              t_start: 2.0
              duration: 14.0
              params: { target_speed: 5.0 }
      design_template:
        - cause: { kind: "state", participant: "B", name: "no_stop" }
          effect: { kind: "state", participant: "B", name: "stop_line_crossed" }
          edge: "CONTRIBUTES_TO"
        - cause: { kind: "state", participant: "B", name: "stop_line_crossed" }
          effect: { kind: "state", participant: "B", name: "conflict_entry" }
          edge: "CONTRIBUTES_TO"
        - cause: { kind: "state", participant: "B", name: "conflict_entry" }
          effect: { kind: "outcome", name: "collision", participants: ["A", "B"] }
          edge: "CAUSES_OUTCOME"
        - cause: { kind: "state", participant: "A", name: "stopped" }
          effect: { kind: "outcome", name: "collision", participants: ["A", "B"] }
          edge: "PREVENTS"
          rationale: "A discharged its own obligation, which acts against the outcome without averting it"
      notes:
        - "A stops and has priority by arrival; B rolls through and strikes it"
        - "the asymmetry is in the normative layer, not in the physical one: both entered the junction"
