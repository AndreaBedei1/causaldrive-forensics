scenario:
  scenario_id: S12
  name: all_way_stop
  description: 'Both A and B face stop signs. Variants differ in who stops first,
    whether the two arrivals are distinguishable at all, and whether one vehicle stops.

    '
  map: Town05
  default_variant: a_arrives_first
  max_duration_s: 18.0
  participants:
  - id: A
    blueprint: vehicle.tesla.model3
    spawn:
      anchor: junction_approach
      junction_x: -283.42
      junction_y: 1.23
      bearing_deg: 180.0
      back_m: 66.0
      lane_offset: -1
    route:
      length_m: 240.0
      step_m: 2.0
      turns:
      - left
      turn_lookahead: true
    initial_speed: 9.0
    target_speed: 9.0
    actions: []
  - id: B
    blueprint: vehicle.audi.tt
    spawn:
      anchor: junction_approach
      junction_x: -283.42
      junction_y: 1.23
      bearing_deg: -90.0
      back_m: 50.0
    route:
      length_m: 240.0
      step_m: 2.0
      turns:
      - straight
      turn_lookahead: true
    initial_speed: 9.0
    target_speed: 9.0
    actions: []
  variants:
    a_arrives_first:
      participant_overrides:
        A:
          actions:
          - action_id: A_stop
            kind: brake
            t_start: 2.7
            duration: 3.8
            params:
              intensity: 0.9
          - action_id: A_proceed
            kind: set_speed
            t_start: 6.5
            duration: 8.0
            params:
              target_speed: 8.0
        B:
          initial_speed: 6.0
          target_speed: 6.0
          actions:
          - action_id: B_stop
            kind: brake
            t_start: 4.4
            duration: 6.1
            params:
              intensity: 0.9
          - action_id: B_proceed
            kind: set_speed
            t_start: 10.5
            duration: 6.0
            params:
              target_speed: 8.0
    b_arrives_first:
      participant_overrides:
        A:
          initial_speed: 6.0
          target_speed: 6.0
          actions:
          - action_id: A_stop
            kind: brake
            t_start: 4.4
            duration: 6.1
            params:
              intensity: 0.9
          - action_id: A_proceed
            kind: set_speed
            t_start: 10.5
            duration: 6.0
            params:
              target_speed: 8.0
        B:
          actions:
          - action_id: B_stop
            kind: brake
            t_start: 2.7
            duration: 3.8
            params:
              intensity: 0.9
          - action_id: B_proceed
            kind: set_speed
            t_start: 6.5
            duration: 8.0
            params:
              target_speed: 8.0
    near_simultaneous:
      participant_overrides:
        A:
          actions:
          - action_id: A_stop
            kind: brake
            t_start: 2.7
            duration: 4.3
            params:
              intensity: 0.95
          - action_id: A_proceed
            kind: set_speed
            t_start: 7.0
            duration: 8.0
            params:
              target_speed: 8.0
        B:
          actions:
          - action_id: B_stop
            kind: brake
            t_start: 2.8
            duration: 4.2
            params:
              intensity: 0.95
          - action_id: B_proceed
            kind: set_speed
            t_start: 7.0
            duration: 8.0
            params:
              target_speed: 9.5
    b_fails_to_stop:
      participant_overrides:
        A:
          actions:
          - action_id: A_stop
            kind: brake
            t_start: 2.7
            duration: 5.1
            params:
              intensity: 0.9
          - action_id: A_proceed
            kind: set_speed
            t_start: 7.8
            duration: 8.0
            params:
              target_speed: 8.0
        B:
          spawn:
            anchor: junction_approach
            junction_x: -283.42
            junction_y: 1.23
            bearing_deg: -90.0
            back_m: 80.0
          actions:
          - action_id: B_roll_through
            kind: set_speed
            t_start: 2.0
            duration: 14.0
            params:
              target_speed: 5.0
