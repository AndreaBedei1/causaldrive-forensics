scenario:
  scenario_id: S11
  name: single_stop_b
  description: 'B faces a stop sign on its approach; A does not and has benchmark
    priority. Structurally identical to S10 with the roles exchanged, which is what
    makes it a check on symmetry rather than an extra data point.

    '
  map: Town05
  default_variant: rolls_through
  max_duration_s: 28.0
  participants:
  - id: A
    blueprint: vehicle.tesla.model3
    spawn:
      anchor: junction_approach
      junction_x: 152.54
      junction_y: -0.23
      bearing_deg: 90.0
      back_m: 60.0
    route:
      length_m: 240.0
      step_m: 2.0
      turns:
      - straight
      turn_lookahead: true
    initial_speed: 10.0
    target_speed: 10.0
    actions: []
  - id: B
    blueprint: vehicle.audi.tt
    spawn:
      anchor: junction_approach
      junction_x: 152.54
      junction_y: -0.23
      bearing_deg: 0.0
      back_m: 45.0
    route:
      length_m: 110.0
      step_m: 2.0
      turns:
      - left
      turn_lookahead: true
    initial_speed: 9.0
    target_speed: 9.0
    actions: []
  variants:
    rolls_through:
      participant_overrides:
        B:
          actions:
          - action_id: B_roll_through
            kind: set_speed
            t_start: 2.0
            duration: 14.0
            params:
              target_speed: 5.5
    stops_safely:
      participant_overrides:
        B:
          actions:
          - action_id: B_full_stop
            kind: brake
            t_start: 2.6
            duration: 7.0
            params:
              intensity: 0.9
    stops_then_proceeds:
      max_duration_s: 16.0
      participant_overrides:
        B:
          actions:
          - action_id: B_full_stop
            kind: brake
            t_start: 2.6
            duration: 4.2
            params:
              intensity: 0.9
          - action_id: B_pull_away
            kind: set_speed
            t_start: 7.4
            duration: 6.0
            params:
              target_speed: 9.0
