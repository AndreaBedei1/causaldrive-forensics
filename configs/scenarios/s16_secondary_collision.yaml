scenario:
  scenario_id: S16
  name: secondary_collision
  description: 'A brakes and B runs into the back of it. What becomes of A -- knocked
    into the next lane and into C, driving into C later of its own accord, or stopping
    clear -- is what the variants change.

    '
  map: Town05
  default_variant: consequential
  max_duration_s: 10.0
  participants:
  - id: A
    blueprint: vehicle.audi.tt
    spawn:
      anchor: spawn_index
      index: 265
      forward_m: 7.0
      lane_offset: 0
    route:
      length_m: 200.0
      step_m: 2.0
    initial_speed: 13.0
    target_speed: 13.0
    actions:
    - action_id: A_emergency_brake
      kind: brake
      t_start: 4.0
      duration: 7.0
      params:
        intensity: 0.45
  - id: B
    blueprint: vehicle.nissan.patrol
    spawn:
      anchor: spawn_index
      index: 265
      forward_m: 0.0
      lane_offset: 0
    route:
      length_m: 200.0
      step_m: 2.0
    initial_speed: 13.0
    target_speed: 13.0
    actions:
    - action_id: B_late_brake
      kind: brake
      t_start: 4.8
      duration: 1.5
      params:
        intensity: 0.4
  - id: C
    blueprint: vehicle.mercedes.sprinter
    spawn:
      anchor: spawn_index
      index: 265
      forward_m: 73.5
      lane_offset: -1
    route:
      length_m: 70.0
      step_m: 2.0
    initial_speed: 1.0
    target_speed: 1.0
    actions: []
  variants:
    consequential:
      participant_overrides:
        A:
          post_impact_mode: deflect
          post_impact_lateral_m: -9.0
          post_impact_deflect_s: 0.3
    independent:
      max_duration_s: 18.0
      participant_overrides:
        A:
          post_impact_mode: drive
          actions:
          - action_id: A_emergency_brake
            kind: brake
            t_start: 4.0
            duration: 7.0
            params:
              intensity: 0.45
          - action_id: A_pulls_away
            kind: set_speed
            t_start: 10.5
            duration: 12.0
            params:
              target_speed: 9.0
          - action_id: A_changes_lane
            kind: lane_shift
            t_start: 11.0
            duration: 2.5
            params:
              lateral_m: -4.2
        C:
          spawn:
            anchor: spawn_index
            index: 265
            forward_m: 84.0
            lane_offset: -1
    avoided:
      participant_overrides:
        A:
          post_impact_mode: stop
