    - action_id: J_keeps_speed
      kind: hold
      t_start: 10.0
      duration: 2.0
      params: {target_speed: 12.0}
  # NOT YET ACQUIRED (prepared 2026-10-13): traces/S19/run_0 (default variant) has its three abreast rows all
  # AHEAD of A and B: no other car comes within 14 m of the recorders before the contact
  # (scripts/scenario_density.py).  "surrounded" puts A and B inside the pack: K diagonally ahead-left of B and
  # a row of three cars 12-14 m behind them, which brakes once the crash is ahead (as F and G in S22).  K is
