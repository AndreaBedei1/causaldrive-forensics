scenario:
  scenario_id: S19
  name: dense_abreast
  description: 'Dense three-lane traffic, one direction, nine cars in three rows that drive abreast at
    the same speed with short headways (about 15 m).  The recorders A (right lane) and B (middle lane,
    slightly behind and slightly faster) are in the last row; the seven others record nothing: three
    abreast rows ahead of them.  For six seconds nothing happens:
    every car keeps its lane.  Then A drifts left into B (over 2 s) and they collide (the only contact); everyone
    else drives on.  A correct reconstruction keeps every abreast pair apart before and after the
    contact, never merges two of the seven into one road user, names the contact partner B, and
    leaves an identity unresolved rather than guessing.

    '
  research_question: In dense abreast traffic, does the identity reconstruction keep adjacent road users
    apart and name the single collision partner?
  map: Town05
  context:
    road_environment: urban arterial, three lanes one direction
    speed_limit_kmh: 50
  max_duration_s: 12.0
  participants:
  - id: A
    blueprint: vehicle.audi.tt
    spawn: {anchor: spawn_index, index: 265, forward_m: 25.0, lane_offset: 1}
    route: {length_m: 220.0, step_m: 2.0}
    initial_speed: 12.0
    target_speed: 12.0
    post_impact_mode: coast
    actions:
    - action_id: A_drifts_left
      kind: lane_shift
      t_start: 6.0
      duration: 2.0
      params: {lateral_m: -3.5}
  - id: B
    blueprint: vehicle.nissan.patrol
    spawn: {anchor: spawn_index, index: 265, forward_m: 21.0, lane_offset: 0}
    route: {length_m: 220.0, step_m: 2.0}
    initial_speed: 12.5
    target_speed: 12.5
    post_impact_mode: coast
    actions: []
  - id: C
    blueprint: vehicle.tesla.model3
    record: false
    spawn: {anchor: spawn_index, index: 265, forward_m: 40.0, lane_offset: -1}
    route: {length_m: 240.0, step_m: 2.0}
    initial_speed: 12.0
    target_speed: 12.0
    post_impact_mode: drive
    actions: []
  - id: D
