scenario:
  scenario_id: S02
  name: cut_in
  description: 'B starts in the lane to A''s left, slightly ahead, then moves laterally
    into A''s lane while travelling slower than A. A closes rapidly and reacts late.

    '
  map: Town05
  context:
    road_environment: urban road, two adjacent lanes
    speed_limit_kmh: 50
  default_variant: crash
  max_duration_s: 26.0
  participants:
  - id: A
    blueprint: vehicle.tesla.model3
    spawn:
      anchor: spawn_index
      index: 265
      forward_m: 0.0
      lane_offset: 0
    route:
      length_m: 150.0
      step_m: 2.0
    initial_speed: 14.0
    target_speed: 14.0
    actions:
    - action_id: A_late_brake
      kind: brake
      t_start: 3.9
      duration: 6.0
      params:
        intensity: 0.85
  - id: B
    blueprint: vehicle.audi.tt
    spawn:
      anchor: spawn_index
      index: 265
      forward_m: 30.0
      lane_offset: -1
    route:
      length_m: 130.0
      step_m: 2.0
    initial_speed: 9.0
    target_speed: 9.0
    actions:
    - action_id: B_cut_in
      kind: lane_shift
      t_start: 1.0
      duration: 2.2
      params:
        lateral_m: 3.5
    - action_id: B_slow_after_cut_in
      kind: set_speed
      t_start: 3.2
      duration: 12.0
      params:
        target_speed: 6.5
  variants:
    crash:
      # Measured scratch trials: earlier cut-in alone left CRITICAL before
      # CUT_IN; extra separation needed a correspondingly later reaction by A.
      # Overrides keep critical_before_cut_in's physical configuration intact.
      participant_overrides:
        A:
          actions:
          - action_id: A_late_brake
            kind: brake
            t_start: 4.5
            duration: 6.0
            params:
              intensity: 0.85
        B:
          spawn:
            forward_m: 35.0
          actions:
          - action_id: B_cut_in
            kind: lane_shift
            t_start: 0.2
            duration: 2.2
            params:
              lateral_m: 3.5
          - action_id: B_slow_after_cut_in
            kind: set_speed
            t_start: 3.2
            duration: 12.0
            params:
              target_speed: 6.5
    critical_before_cut_in:
      description: 'B drives much slower in the lane to A''s left. A closes on it so fast that
        its time-to-contact with B is already critical before B starts moving into A''s
        lane; A slows down too little and strikes B from behind.  Turn indicators (lights only,
        independent of the motion): B signals right from 1 s before its cut-in to its end; A
        switches its left indicator on for 1.2 s and does not change lane.

        '
      participant_overrides:
        A:
          actions:
          - action_id: A_slows_too_little
            kind: set_speed
            t_start: 2.5
            duration: 9.0
            params:
              target_speed: 9.0
          - action_id: A_indicator_left_without_manoeuvre
            kind: indicator
            t_start: 0.3
            duration: 1.2
            params:
              side: -1
        B:
          initial_speed: 6.0
          target_speed: 6.0
          actions:
          - action_id: B_cut_in
            kind: lane_shift
            t_start: 1.6
            duration: 2.2
            params:
              lateral_m: 3.5
          - action_id: B_indicator_right
            kind: indicator
            t_start: 0.6
            duration: 3.4
            params:
              side: 1
