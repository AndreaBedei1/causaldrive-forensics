scenario:
  scenario_id: S13
  name: disputed_lane_change
  description: 'A travels in the right lane; B is alongside in the left. In the disputed
    variants the gap between them closes and they touch, and which behaviour closed
    it differs. The safe variant keeps the same manoeuvre with room.

    '
  map: Town05
  default_variant: cut_in
  max_duration_s: 10.0
  participants:
  - id: A
    blueprint: vehicle.tesla.model3
    spawn:
      anchor: location
      x: -112.9
      y: -190.1
    route:
      length_m: 150.0
      step_m: 2.0
    initial_speed: 11.0
    target_speed: 11.0
    actions: []
  - id: B
    blueprint: vehicle.audi.tt
    spawn:
      anchor: location
      x: -87.9
      y: -193.6
    route:
      length_m: 150.0
      step_m: 2.0
    initial_speed: 7.0
    target_speed: 7.0
    actions: []
  variants:
    cut_in:
      participant_overrides:
        B:
          actions:
          - action_id: B_cut_in
            kind: lane_shift
            t_start: 2.5
            duration: 2.5
            params:
              lateral_m: 3.5
          - action_id: B_continue_after_cut_in
            kind: hold
            t_start: 5.0
            duration: 5.0
            params:
              target_speed: 7.0
    accelerates_into_gap:
      participant_overrides:
        A:
          spawn:
            anchor: location
            x: -124.9
            y: -190.1
          actions:
          - action_id: A_accelerate
            kind: set_speed
            t_start: 2.0
            duration: 8.0
            params:
              target_speed: 15.0
        B:
          actions:
          - action_id: B_cut_in
            kind: lane_shift
            t_start: 2.2
            duration: 3.8
            params:
              lateral_m: 3.5
    safe_lane_change:
      participant_overrides:
        B:
          actions:
          - action_id: B_cut_in
            kind: lane_shift
            t_start: 2.5
            duration: 3.5
            params:
              lateral_m: 3.5
          - action_id: B_keeps_pace
            kind: set_speed
            t_start: 0.0
            duration: 10.0
            params:
              target_speed: 10.0
