scenario:
  scenario_id: S04
  name: crossing_braking
  description: 'Identical crossing geometry to S03, but B brakes and yields on the
    approach. The paths still conflict; the outcome does not.

    '
  map: Town05
  default_variant: yield
  max_duration_s: 28.0
  participants:
  - id: A
    blueprint: vehicle.tesla.model3
    spawn:
      anchor: junction_approach
      junction_x: 101.6
      junction_y: 0.3
      bearing_deg: 0.0
      back_m: 50.0
    route:
      length_m: 110.0
      step_m: 2.0
      turns:
      - straight
    initial_speed: 10.0
    target_speed: 10.0
    actions: []
  - id: B
    blueprint: vehicle.audi.tt
    spawn:
      anchor: junction_approach
      junction_x: 101.6
      junction_y: 0.3
      bearing_deg: -90.0
      back_m: 42.0
    route:
      length_m: 110.0
      step_m: 2.0
      turns:
      - straight
    initial_speed: 9.0
    target_speed: 9.0
    actions:
    - action_id: B_yield_brake
      kind: brake
      t_start: 3.2
      duration: 4.0
      params:
        intensity: 0.9
    - action_id: B_resume
      kind: set_speed
      t_start: 8.0
      duration: 14.0
      params:
        target_speed: 7.0
  variants:
    yield:
      max_duration_s: 10.0
