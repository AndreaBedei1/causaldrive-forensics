scenario:
  scenario_id: S14
  name: dense_abreast
  description: 'Dense three-lane traffic, one direction, fourteen cars: the recorders A (right lane) and B
    (middle lane, slightly behind and slightly faster) drive inside the pack.  Three abreast rows are ahead
    of them (15, 30 and 45 m), a car is just ahead of A in the right lane, a car is diagonally behind-left of
    B, and a row of three abreast cars follows 12-16 m behind.  For six seconds nothing happens: every car
    keeps its lane.  Then A drifts left into B (over 2 s) and they collide (the only contact); the cars behind
    brake moderately once the crash is ahead, everyone else drives on.  A correct reconstruction keeps every
    abreast pair apart before and after the contact, never merges two of the twelve into one road user,
    names the contact partner B, and leaves an identity unresolved rather than guessing.

    '
  research_question: In dense abreast traffic around the recorders, does the identity reconstruction keep
    adjacent road users apart and name the single collision partner?
  map: Town05
  context:
    road_environment: urban arterial, three lanes one direction
    speed_limit_kmh: 50
  max_duration_s: 12.0
  default_variant: surrounded
  participants:
  - id: A
    blueprint: vehicle.audi.tt
    spawn: {anchor: spawn_index, index: 265, forward_m: 25.0, lane_offset: 1}
    route: {length_m: 220.0, step_m: 2.0}
    initial_speed: 12.0
    target_speed: 12.0
    post_impact_mode: coast
    actions:
    - {action_id: A_drifts_left, kind: lane_shift, t_start: 6.0, duration: 2.0, params: {lateral_m: -3.5}}
  - id: B
    blueprint: vehicle.nissan.patrol
    spawn: {anchor: spawn_index, index: 265, forward_m: 21.0, lane_offset: 0}
    route: {length_m: 220.0, step_m: 2.0}
    initial_speed: 12.5
    target_speed: 12.5
    post_impact_mode: coast
    actions: []
  # Three abreast rows ahead of the recorders.
  - {id: C, blueprint: vehicle.tesla.model3, record: false, spawn: {anchor: spawn_index, index: 265, forward_m: 40.0, lane_offset: -1}, route: {length_m: 240.0, step_m: 2.0}, initial_speed: 12.0, target_speed: 12.0, post_impact_mode: drive, actions: []}
  - {id: D, blueprint: vehicle.toyota.prius, record: false, spawn: {anchor: spawn_index, index: 265, forward_m: 40.0, lane_offset: 0}, route: {length_m: 240.0, step_m: 2.0}, initial_speed: 12.0, target_speed: 12.0, post_impact_mode: drive, actions: []}
  - {id: E, blueprint: vehicle.tesla.model3, record: false, spawn: {anchor: spawn_index, index: 265, forward_m: 40.5, lane_offset: 1}, route: {length_m: 240.0, step_m: 2.0}, initial_speed: 12.0, target_speed: 12.0, post_impact_mode: drive, actions: []}
  - {id: F, blueprint: vehicle.audi.tt, record: false, spawn: {anchor: spawn_index, index: 265, forward_m: 55.0, lane_offset: -1}, route: {length_m: 240.0, step_m: 2.0}, initial_speed: 12.0, target_speed: 12.0, post_impact_mode: drive, actions: []}
  - {id: G, blueprint: vehicle.toyota.prius, record: false, spawn: {anchor: spawn_index, index: 265, forward_m: 55.5, lane_offset: 1}, route: {length_m: 240.0, step_m: 2.0}, initial_speed: 12.0, target_speed: 12.0, post_impact_mode: drive, actions: []}
  - {id: H, blueprint: vehicle.tesla.model3, record: false, spawn: {anchor: spawn_index, index: 265, forward_m: 70.5, lane_offset: -1}, route: {length_m: 240.0, step_m: 2.0}, initial_speed: 12.0, target_speed: 12.0, post_impact_mode: drive, actions: []}
  - id: J
    blueprint: vehicle.audi.tt
    record: false
    spawn: {anchor: spawn_index, index: 265, forward_m: 70.0, lane_offset: 0}
    route: {length_m: 240.0, step_m: 2.0}
    initial_speed: 12.0
    target_speed: 12.0
    post_impact_mode: drive
    # J simply keeps its speed; the action marks the end of the observation window (the runner records
    # until every declared manoeuvre is over).
    actions:
    - {action_id: J_keeps_speed, kind: hold, t_start: 10.0, duration: 2.0, params: {target_speed: 12.0}}
  # Just ahead of A in the right lane (A drifts left, away from it).
