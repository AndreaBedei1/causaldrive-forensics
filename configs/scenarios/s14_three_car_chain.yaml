scenario:
  scenario_id: S14
  name: three_car_chain
  description: 'A leads, B follows, C is last, all in one lane. A brakes. Which pair
    collides first, and which vehicle was merely in the way, depends on how B responds.
    A third variant, independent_runs, was retired: it produced its second impact
    by having C come to a complete stop and then deliberately creep into the stationary
    pile seven seconds later, which is not a road situation. The distinction it was
    testing, that two impacts sharing a vehicle must not be chained merely for sharing
    it, is what S16 tests between its consequential and independent variants, and
    S16 does it without asking a driver to drive into a wreck.

    '
  map: Town05
  default_variant: c_pushes_b
  max_duration_s: 30.0
  participants:
  - id: A
    blueprint: vehicle.tesla.model3
    spawn:
      anchor: spawn_index
      index: 265
      forward_m: 33.0
      lane_offset: 0
    route:
      length_m: 120.0
      step_m: 2.0
    initial_speed: 13.0
    target_speed: 13.0
    actions:
    - action_id: A_brake
      kind: brake
      t_start: 4.0
      duration: 8.0
      params:
        intensity: 0.85
  - id: B
    blueprint: vehicle.audi.tt
    spawn:
      anchor: spawn_index
      index: 265
      forward_m: 15.0
      lane_offset: 0
    route:
      length_m: 130.0
      step_m: 2.0
    initial_speed: 13.0
    target_speed: 13.0
    actions: []
  - id: C
    blueprint: vehicle.nissan.patrol
    spawn:
      anchor: spawn_index
      index: 265
      forward_m: 8.0
      lane_offset: 0
    route:
      length_m: 140.0
      step_m: 2.0
    initial_speed: 13.0
    target_speed: 13.0
    actions: []
  variants:
    c_pushes_b:
      participant_overrides:
        B:
          post_impact_mode: coast
          actions:
          - action_id: B_brake
            kind: brake
            t_start: 4.9
            duration: 2.5
            params:
              intensity: 0.75
        C:
          actions:
          - action_id: C_no_response
            kind: set_speed
            t_start: 4.0
            duration: 10.0
            params:
              target_speed: 13.0
    b_hits_a_first:
      participant_overrides:
        B:
          actions:
          - action_id: B_late_brake
            kind: brake
            t_start: 6.3
            duration: 8.0
            params:
              intensity: 1.0
        C:
          actions:
          - action_id: C_late_brake
            kind: brake
            t_start: 6.9
            duration: 8.0
            params:
              intensity: 1.0
