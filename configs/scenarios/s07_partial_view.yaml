scenario:
  scenario_id: S07
  name: partial_view
  description: 'C brakes hard, B responds, A closes on B and strikes it. A cannot
    observe C at all because B occludes it and A uses a narrow-FOV radar. The
    participants retain their configured sensor profiles.

    '
  map: Town05
  default_variant: occluded
  max_duration_s: 30.0
  participants:
  - id: A
    blueprint: vehicle.tesla.model3
    spawn:
      anchor: spawn_index
      index: 265
      forward_m: 0.0
      lane_offset: 0
    route:
      length_m: 150.0
      step_m: 2.0
    initial_speed: 14.0
    target_speed: 14.0
    sensor_profile: radar_narrow_fov
    actions:
    - action_id: A_late_brake
      kind: brake
      t_start: 6.2
      duration: 8.0
      params:
        intensity: 0.8
  - id: B
    blueprint: vehicle.audi.tt
    spawn:
      anchor: spawn_index
      index: 265
      forward_m: 24.0
      lane_offset: 0
    route:
      length_m: 130.0
      step_m: 2.0
    initial_speed: 14.0
    target_speed: 14.0
    sensor_profile: radar_baseline
    actions:
    - action_id: B_reaction_brake
      kind: brake
      t_start: 3.7
      duration: 10.0
      params:
        intensity: 1.0
  - id: C
    blueprint: vehicle.nissan.patrol
    spawn:
      anchor: spawn_index
      index: 265
      forward_m: 50.0
      lane_offset: 0
    route:
      length_m: 110.0
      step_m: 2.0
    initial_speed: 14.0
    target_speed: 14.0
    sensor_profile: radar_baseline
    actions:
    - action_id: C_emergency_brake
      kind: brake
      t_start: 3.0
      duration: 10.0
      params:
        intensity: 1.0
  variants:
    occluded: {}
    full_view:
      participant_overrides:
        A:
          sensor_profile: radar_baseline
