[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "carla-distributed-causal-forensics"
version = "0.1.0"
description = "Distributed multi-vehicle causal forensics for CARLA: per-vehicle local evidence, post-event graph fusion, counterfactual attribution and finite-trace model checking."
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
authors = [{ name = "carla-distributed-causal-forensics contributors" }]
keywords = ["carla", "forensics", "causal-inference", "radar", "graph-fusion", "model-checking"]

dependencies = [
    "numpy>=1.20,<2.0",
    "scipy>=1.7",
    "networkx>=2.6",
    "pandas>=1.3",
    "PyYAML>=5.4",
    "matplotlib>=3.4",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]
# `carla` is NOT a hard dependency: every module except cdf.simulation.* imports
# and tests cleanly without the simulator. Install it from the CARLA distribution
# wheel matching your server (see docs/ENVIRONMENT.md).
sim = ["carla==0.9.15"]

[project.scripts]
cdf = "cdf.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "carla: integration test that requires a running CARLA server (deselect with '-m \"not carla\"')",
    "slow: long-running test",
]
filterwarnings = ["ignore::DeprecationWarning"]
