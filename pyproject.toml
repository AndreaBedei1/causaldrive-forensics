[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "carla-raw-acquisition"
version = "0.1.0"
description = "Raw CARLA scenario acquisition with separate vehicle and simulator traces."
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
dependencies = ["PyYAML>=5.4", "numpy>=1.23", "Pillow>=9.0", "opencv-python>=4.5; python_version >= '3.8'"]

[project.optional-dependencies]
sim = ["carla==0.9.15"]

[tool.setuptools.packages.find]
where = ["src"]
